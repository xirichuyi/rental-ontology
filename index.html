function aipResultForModel(result,asOf){
 if(result.aggregate)return {
  asOf,summary:result.message,...result.aggregate,
  objects:result.records.map(({id,label,attributes})=>({id,name:String(label).slice(0,100),attributes}))
 }
 return {asOf,summary:result.message,object:result.focus||null,
  view:result.view?{name:result.view.name,total:result.view.total,
   rows:result.view.items.map(row=>row.map(({label,value})=>({label,value}))),
   excludedTotal:result.view.excludedTotal,
   excluded:result.view.excluded.map(({record,facts,reasons})=>({id:record.id,facts,reasons}))}:null}
}
async function submitAip(question,selectedLookup,asOf=aipState().asOf){
 question=question.trim()
 const aip=aipState()
 if(!question||aip.busy)return
 const turn={question,asOf,message:'等待模型选择工具…',steps:[],calls:[],candidates:[],records:[]}
 aip.turns.push(turn)
 if(aip.turns.length>15)aip.turns.shift()
 aip.selected=aip.turns.length-1;aip.busy=true
 render();focusAipReply()
 try{
  if(!aipDate(asOf))throw Error('请选择有效的查询日期。')
  const scope=aipReadScope()
  let plan=await aipRequest('plan',{question,asOf,selectedLookup,
   workspace:{name:WORKSPACE.name},agent:activeAssistant()?{name:activeAssistant().name,instructions:activeAssistant().instructions,version:S.aipAgents[S.activeAgent].version}:null,conversation:aipConversation(aip),
   objectTypes:aipCatalog(scope),views:aipViewCatalog(scope),actions:aipActionCatalog(scope),functions:aipFunctionCatalog(scope),toolGuidance:aipToolGuidance(),retrievalContext:aipRetrievalContext(scope)})
  if(S.ui.aip!==aip||S.user!==aip.user)return
  turn.modelContext=plan.initialContext;turn.toolDefinitions=plan.tools
  for(let n=0;n<=8;n++){
   if(S.ui.aip!==aip||S.user!==aip.user)return
   turn.model=plan.model
   if(plan.tool==='prepare_action'){
    const proposal=aipMakeActionProposal(plan.action,question,aipReadScope(),aip)
    if(aip.pending)aip.pending.superseded=true
    aip.pending=proposal;turn.proposal=proposal
    turn.message=proposal.mode==='revise'?'已更新「'+proposal.name+'」草稿，请核对后提交。':'已准备「'+proposal.name+'」草稿，请核对后提交。'
    turn.calls.push({tool:plan.tool,arguments:plan.action,result:{status:'awaiting_confirmation'}})
    turn.steps.push({title:'准备 Action，等待确认',tool:proposal.apiName,detail:'尚未提交业务变更',records:[]})
    for(const target of proposal.resolution)turn.steps.push({title:'定位'+target.field,tool:target.via||target.record.typeId,detail:'已匹配 '+target.record.id,records:[target.record]})
    return
   }
   if(!plan.toolId){
    turn.message=plan.answer||'本轮已结束。'
    turn.steps.push({title:plan.limited?'达到调用上限':'模型生成回答',tool:plan.model,detail:plan.limited?'可缩小问题后继续查询。':'根据已提供上下文和工具结果回答。',records:[]})
    return
   }
   const args=plan.query||plan.view||plan.discovery||plan.functionCall||plan.request
   let output=plan.result
   turn.steps.push({title:'模型请求工具',tool:plan.tool,detail:JSON.stringify(args),records:[]})
   if(output){
    turn.steps.push({title:output.error?'请求未执行':output.kind==='action_catalog'?'返回候选 Action':'读取结构定义',tool:plan.tool,
     detail:output.error||(output.kind==='action_schema'?output.action.name+' · '+output.action.parameters.length+' 个参数 · '+output.action.description:output.kind==='schema'?output.objectType.name+' · '+output.objectType.properties.length+' 个属性 · '+output.objectType.links.length+' 个方向 Link':'找到 '+output.total+' 个'+(output.kind==='action_catalog'?' Action':'类型')+'；本页 '+output.items.length+' 个：'+output.items.map(item=>item.name).join('、')),records:[]})
   }else{
    try{
     if(plan.tool==='call_function'){
      output=aipRunFunction(plan.functionCall,aipReadScope())
      turn.steps.push({title:'执行只读 Function',tool:output.functionId,detail:'v'+output.version+' · 返回 '+JSON.stringify(output.value),records:[]})
     }else{
     const read=aipReadScope(),result=plan.tool==='query_ontology'?aipOntologyQuery(plan.query,asOf,read):aipRunView(plan.view,asOf,read)
     const {steps,...rest}=result;Object.assign(turn,rest);turn.steps.push(...steps)
     if(result.focus)aip.focus=result.focus
     output=aipResultForModel(result,asOf)
     if(result.candidates.length){turn.calls.push({tool:plan.tool,arguments:args,result:output});return}
     }
    }catch(error){output={error:error.message};turn.steps.push({title:'查询被拒绝',tool:plan.tool,detail:error.message,records:[]})}
   }
   turn.calls.push({tool:plan.tool,arguments:args,result:output})
   turn.message='已完成 '+turn.calls.length+' 次工具调用，模型正在判断下一步…'
   if(route()[0]==='aip')render()
   plan=await aipRequest('answer',{toolId:plan.toolId,result:output})
  }
  throw Error('已达到本轮调用上限。')
 }catch(error){turn.message=turn.records.length?'查询已返回部分结果，后续处理未完成。':'这次请求未完成。';turn.error=error.message}
 finally{
  aip.busy=false
  if(S.ui.aip===aip&&S.user===aip.user&&route()[0]==='aip'){render();focusAipReply()}
 }
}
function aipSamplePlan(){
 if(activeAssistant()||WORKSPACE_ID==='builder')return null
 if(diff().length)return null
 const onto=C()
 if(Object.values(onto).every(group=>!Object.keys(group).length)&&!S.logs.length&&!Object.keys(S.edits).length){
  if(['Tenant','House','Agent','Lease'].every(id=>JSON.stringify(S.datasets[id]?.fields)===JSON.stringify(SEED_DS[id].fields)&&
   JSON.stringify(S.datasets[id]?.rows)===JSON.stringify(SEED_DS[id].rows)))return 'blank'
 }
 if(onto.actionTypes['sign-lease']&&onto.objectTypes.tenant?.apiName==='Tenant'&&onto.objectTypes.lease?.apiName==='Lease'&&
  onto.objectTypes.house?.apiName==='House'&&titleOf('tenant',findObj('tenant','T01',onto))==='张三'&&
  titleOf('house',findObj('house','H01',onto))==='海淀区学区房'&&findObj('agent','A01',onto)&&
  aipLeaseLink(onto,onto.objectTypes.lease,onto.objectTypes.tenant,'tenant_id','lease-tenant')&&
  aipLeaseLink(onto,onto.objectTypes.lease,onto.objectTypes.house,'house_id','lease-house')&&
  !objectsOf('lease',onto).length&&!S.edits.lease?.deleted?.includes('L-AIP-001'))return 'configured'
 return null
}
function loadAipSample(){
 const plan=aipSamplePlan()
 if(!plan)throw Error('当前工作区已有租约或其他配置。可以直接查询现有数据。')
 const asOf=aipState().asOf
 if(!aipDate(asOf))throw Error('请选择有效的查询日期。')
 const snapshot=clone(S)
 try{
  if(plan==='blank')loadSample()
  const relative=offset=>{const date=new Date(asOf+'T00:00:00Z');date.setUTCDate(date.getUTCDate()+offset);return date.toISOString().slice(0,10)}
  const start=relative(-14),end=relative(180),leaseId='L-AIP-001'
  const at=C().actionTypes['sign-lease']
  if(at.rules.some(rule=>!['create','modify'].includes(rule.type)))throw Error('当前签约动作包含其他规则，无法载入标准查询样例。')
  const params={lease_id:leaseId,house:'H01',tenant:'T01',agent:'A01',start,end,monthly_rent:'8500',deposit:'17000'}
  const preview=evaluateAction(at,params,C(),{dry:true})
  if(preview.failures.length)throw Error(preview.failures.join(' '))
  const leaseEdit=preview.edits.find(e=>e.type==='create'&&e.ot==='lease'&&e.pk===leaseId)
  const houseEdit=preview.edits.find(e=>e.type==='modify'&&e.ot==='house'&&e.pk==='H01')
  if(preview.edits.length!==2||leaseEdit?.after.tenant_id!=='T01'||leaseEdit.after.house_id!=='H01'||
   leaseEdit.after.start!==start||leaseEdit.after.end!==end||leaseEdit.after.status!=='有效'||
   houseEdit?.after.current_tenant_id!=='T01'||houseEdit.after.status!=='已出租'){
   throw Error('当前签约动作与样例不一致，未写入租约。')
  }
  const applied=evaluateAction(at,params,C(),{dry:false})
  if(applied.failures.length)throw Error(applied.failures.join(' '))
 }catch(e){S=snapshot;throw e}
 submitAip(AIP_QUESTION)
 toast('已通过签订租约动作创建查询样例。')
}
const aipObjectLink=(record,label)=>'<a href="#/explorer/'+encodeURIComponent(record.typeId)+'/'+encodeURIComponent(record.id)+'">'+esc(label??record.label)+'</a>'
function renderAipProposal(proposal,index,busy){
 if(!proposal)return ''
 if(proposal.submitted)return '<div class="aip-record" style="margin-bottom:8px">'+badge('已提交','ok')+' '+esc(proposal.name)+'</div>'
 if(proposal.superseded)return '<div class="aip-record" style="margin-bottom:8px">'+esc(proposal.name)+' · 已有更新的草稿</div>'
 const filled=proposal.fields.length?'<p>'+proposal.fields.map(field=>esc(field.name)+' '+esc(field.value)).join(' · ')+'</p>':''
 const options=proposal.choices
 const choices=options?'<p class="small-t">可选'+esc(options.label)+' · '+options.total+' 个</p>'+
  (options.records.length?'<div class="aip-turn-tools" style="margin:0 0 8px">'+options.records.map(record=>
   B('aipPickOption',esc(record.label),'small',JSON.stringify([index,record.id]),'aria-pressed="'+(String(proposal.vals[options.parameter])===record.id)+'" '+(busy?'disabled':''))
  ).join('')+'</div>':''):''
 return '<div class="aip-record" style="margin-bottom:8px"><p><strong>'+esc(proposal.name)+'</strong> · 待确认</p>'+filled+choices+
  proposal.warnings.map(warning=>'<p class="small-t">'+esc(warning)+'</p>').join('')+
  B('aipOpenAction','打开确认表单','primary small',index,busy?'disabled':'')+'</div>'
}
function renderAipTurn(turn,index,selected,busy){
 const viewRows=turn.view?.items.map(row=>'<li>'+row.map(cell=>esc(cell.label)+' '+(cell.record?aipObjectLink(cell.record,cell.value):
  '<strong>'+esc(cell.value||'未关联')+'</strong>')).join(' · ')+'</li>').join('')||''
 const controls=turn.candidates.map(record=>B('aipChooseObject',esc(record.label+' · '+record.id),'small',JSON.stringify([index,record.id]),busy?'disabled':'')).join('')
 const aggregate=turn.aggregate?'<div class="aip-record" style="margin:0 0 8px"><strong>'+turn.aggregate.total+'</strong> 个'+esc(turn.aggregate.label)+'对象 <span>· '+esc(turn.aggregate.basis)+'</span></div>':''
 const records=turn.records?.length?'<ul>'+turn.records.map(record=>'<li>'+aipObjectLink(record)+(record.detail?' · '+esc(record.detail):'')+'</li>').join('')+'</ul>':''
 const excluded=turn.view?.excludedTotal?'<div class="aip-record" style="margin-bottom:8px"><strong>找到但被筛选排除的记录 · '+
  turn.view.excludedTotal+' 条</strong><ul>'+turn.view.excluded.map(({record})=>
   '<li>'+aipObjectLink(record)+' · '+esc(record.detail)+'</li>').join('')+'</ul></div>':''
 return '<article class="aip-turn"><div class="aip-question">'+esc(turn.question)+'</div><div class="aip-reply">'+
  '<p class="aip-message">'+esc(turn.message)+'</p>'+(turn.error?'<p class="aip-model-error" role="alert">'+esc(turn.error)+'</p>':'')+renderAipProposal(turn.proposal,index,busy)+renderAipReceipt(turn)+aggregate+records+(viewRows?'<ul>'+viewRows+'</ul>':'')+excluded+
  '<div class="aip-turn-tools">'+controls+B('aipTrace',index===selected?'正在查看轨迹':'查看轨迹','small',index,'aria-pressed="'+(index===selected)+'"')+'</div></div></article>'
}
function pageAip(){
 if(WORKSPACE_ID==='builder'&&!activeAssistant())return pageAssistantBuilder()
 const aip=aipState(),turn=aip.turns[aip.selected],plan=aipSamplePlan()
 const actions=aipActionCatalog(aipReadScope()),canPrepare=actions.length>0
 const disabled=aip.busy?'disabled':''
 const modelLabel=aipConnection?.configured?aipConnection.model+(canPrepare?' · 操作需确认':' · 只读'):aipConnection?.checking||!aipConnection?'正在检查模型配置':'模型服务未配置'
 const examples=(activeAssistant()?[]:WORKSPACE.examples).filter(example=>(!example.action||actions.some(action=>action.apiName===example.action))&&(!example.whenDraft||aip.pending))
 const workspaces=Object.entries(AGENT_WORKSPACES).filter(([id])=>id!==WORKSPACE_ID).map(([id,w])=>
  '<a href="?workspace='+encodeURIComponent(id)+'#/aip">'+esc(w.name)+'</a>').join('')
 const sample=plan?'<div class="card aip-ready row spread"><p>'+(plan==='blank'?'样例会加载租赁模型，并为张三签订一份当前有效租约。':'已有租赁模型，样例会为张三签订一份当前有效租约。')+'</p>'+
  B('loadAipSample','加载查询样例','','',disabled)+'</div>':''
 const trace=turn?.steps.length?'<ol class="aip-trace">'+turn.steps.map((step,i)=>
  '<li><span aria-hidden="true" class="aip-step-num">'+(i+1)+'</span><div class="aip-step-head"><strong>'+esc(step.title)+'</strong><code>'+esc(step.tool)+'</code></div>'+
  '<p class="aip-step-detail">'+esc(step.detail)+'</p>'+(step.records.length?'<div class="aip-records">'+step.records.map(record=>
   '<div class="aip-record">'+aipObjectLink(record)+(record.label!==record.id?' <span>'+esc(record.id)+'</span>':'')+(record.detail?' <span>· '+esc(record.detail)+'</span>':'')+'</div>').join('')+'</div>':'')+'</li>').join('')+'</ol>':
  '<div class="aip-empty-trace">'+(turn?'这次没有执行工具。':'发送问题后，这里会显示所用的工具、查询对象和操作状态。')+'</div>'
 return head('AIP · '+esc(activeAssistant()?.name||WORKSPACE.name),'基于当前 Ontology、角色和对话上下文工作。',workspaces+badge(modelLabel,'gray'))+
  renderRentalDemo()+sample+renderAipExposure()+'<div class="aip-grid"><section class="aip-card" aria-labelledby="aip-chat-heading"><header class="aip-card-head"><div>'+
  '<h2 id="aip-chat-heading">对话</h2><p>使用已保存的 Ontology 和当前对象数据</p>'+(aipConnection?.error?'<p>'+esc(aipConnection.error)+'</p>':'')+'</div>'+
  '<label class="fld"><span>查询基准日</span><input id="aipAsOf" type="date" value="'+esc(aip.asOf)+'" required form="aipForm"></label></header>'+
  '<div id="aipTranscript" class="aip-transcript" role="log" aria-label="对话记录">'+(aip.turns.length?aip.turns.map((item,i)=>renderAipTurn(item,i,aip.selected,aip.busy)).join(''):
   '<p class="aip-empty">可以查询业务数据，也可以接着上一轮继续办理。</p>')+'</div>'+
  '<form id="aipForm" class="aip-form"><div class="row">'+examples.map(example=>
   B('aipExample',esc(example.text),'aip-example',example.text,disabled)).join('')+'</div>'+
  '<div class="aip-input-row"><input id="aipQuestion" aria-label="业务问题" placeholder="输入业务问题…" value="'+esc(aip.draft)+'" autocomplete="off" required maxlength="240"><button type="submit" class="primary" '+disabled+'>'+(aip.busy?'处理中':'发送')+'</button></div>'+
  '<p class="aip-notice">'+(aipConnection?.provider==='codex'?'本机 Codex 使用当前 ChatGPT 登录处理问题和必要的查询结果。':'问题和回答所需的查询结果会发送给模型服务。')+'</p></form></section>'+
  '<section class="aip-card" aria-labelledby="aip-trace-heading"><header class="aip-card-head"><div><h2 id="aip-trace-heading">'+(turn?.proposal?'操作轨迹':'查询轨迹')+'</h2><p>'+
  (turn?.proposal?'准备草稿 → 用户确认 → 提交 Action':turn?'查询基准日 '+esc(turn.asOf):'当前用户 '+esc(USERS[S.user]?.name))+'</p></div></header>'+trace+'</section></div>'+renderAipModelContext(turn)
}
function focusAipReply(){
 requestAnimationFrame(()=>{
  const transcript=$('#aipTranscript')
  if(transcript)transcript.scrollTop=transcript.scrollHeight
  $('#aipQuestion')?.focus({preventScroll:true})
 })
}
Object.assign(ACT,{
 aipExample(text){if(WORKSPACE.examples.some(example=>example.text===text))void submitAip(text)},
 rentalDemoAsk(text){if(WORKSPACE_ID==='rental-demo')void submitAip(text)},
 aipOpenAction(index){
  const aip=aipState(),proposal=aip.turns[index]?.proposal
  if(!proposal||aip.pending!==proposal||aip.busy)return
  const read=aipReadScope(),at=aipActionType(read,proposal.apiName)
  if(!at||at.id!==proposal.id||at.version!==proposal.version)throw Error('当前权限或 Action 配置已变化，请重新发送请求。')
  aip.selected=Number(index)
  openActionForm(proposal.id,'','',proposal.vals)
  for(const p of at.parameters)if(p.default?.kind==='objprop'&&proposal.vals[p.id]===undefined)
   S.ui.modal.vals[p.id]=paramProp(at,S.ui.modal.vals,p.default.value,read.onto)??''
  S.ui.modal.aipTurn=Number(index)
  S.ui.modal.aipProposal=proposal
 },
 aipPickOption(arg){
  const [index,id]=JSON.parse(arg),aip=aipState(),turn=aip.turns[index],proposal=turn?.proposal
  if(!proposal||aip.pending!==proposal||aip.busy)return
  const read=aipReadScope(),at=aipActionType(read,proposal.apiName)
  if(!at||at.version!==proposal.version)throw Error('当前权限或 Action 配置已变化。')
  const choices=aipDraftOptions(proposal,at,read),record=choices?.records.find(r=>r.id===id)
  if(!record)throw Error('该选项当前已不可用。')
  aipSetActionValue(at,proposal.vals,choices.parameter,id)
  aipRefreshProposal(proposal,at,read)
  aip.selected=Number(index)
  turn.steps.push({title:'用户更新草稿参数',tool:at.apiName,detail:choices.label+' '+record.label,records:[record]})
 },
 aipTrace(index){if(aipState().turns[index])aipState().selected=Number(index)},
 aipChooseObject(arg){
  const [index,id]=JSON.parse(arg),turn=aipState().turns[index]
  if(turn?.viewId&&turn.candidates.some(record=>record.id===id))void submitAip(turn.question,{id:turn.viewId,lookup:id},turn.asOf)
 },
 loadAipSample(){loadAipSample()}
})
document.addEventListener('input',e=>{
 if(e.target.id==='aipAsOf')aipState().asOf=e.target.value
 if(e.target.id==='aipQuestion')aipState().draft=e.target.value
})
document.addEventListener('submit',e=>{
 if(e.target.id!=='aipForm')return
 e.preventDefault()
 if(aipState().busy)return
 const question=$('#aipQuestion').value.trim()
 if(!question)return
 aipState().draft=''
 void submitAip(question)
})
installAipExposure()
installAuthoring()
installLoftyWorks()
installLoftyBusiness()
installLoftyJourney()
window.addEventListener('popstate',()=>go(location.hash.startsWith('#/')?location.hash.slice(2):WORKSPACE_HOME,false))
window.addEventListener('hashchange',()=>{const h=location.hash.startsWith('#/')?location.hash.slice(2):WORKSPACE_HOME;if(h!==ROUTE)go(h,false)})
window.addEventListener('pagehide',persist)
if(restore()){if(WORKSPACE_ID==='loftyworks')upgradeLoftyWorks();toast('已恢复上次的工作区。')}
else loadConfiguredWorkspace()
document.title=WORKSPACE.name+' · Ontology Lab'
if(location.hash.startsWith('#/'))ROUTE=location.hash.slice(2)
else if(WORKSPACE_ID==='uk-lettings')ROUTE=WORKSPACE_HOME
render()
void checkAipConnection()
restoreUkIntegration()
</script>
