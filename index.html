<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>租约本体工作台</title>
<style>:root{
 --bg:#edeff2;--panel:#fff;--panel2:#f6f7f9;--line:#d3d8de;--line2:#e5e8eb;--text:#1c2127;--text2:#404854;--muted:#5f6b7c;--muted2:#738091;
 --input-line:#c5cbd3;--hover:#f3f5f7;--tag:#e5e8eb;--code:#eef1f4;--disabled:#f1f3f5;--dot:#cfd5dc;--node-line:#a7b6c2;
 --blue:#2d72d2;--blue-d:#215db0;--blue-l:#e6effb;--blue-t:#184a90;--green:#238551;--green-l:#e3f2ea;--green-t:#1c6e42;--green-line:#b9dcc8;
 --orange:#c87619;--orange-l:#fbefe0;--orange-t:#935610;--red:#cd4246;--red-l:#fbe8e8;--red-t:#8e2a2d;--red-line:#e7b3b4;
 --violet:#7961db;--violet-l:#efebfb;--violet-t:#5642a6;--yellow-l:#fff3c4;--yellow-t:#7a5b00;--dark:#1c2127;--dark2:#2f343c
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#111418;--panel:#1c2127;--panel2:#252a31;--line:#383e47;--line2:#2f343c;--text:#e5e8eb;--text2:#c5cbd3;--muted:#abb3bf;--muted2:#8f99a8;
 --input-line:#4b535e;--hover:#2a3038;--tag:#2f343c;--code:#2a3038;--disabled:#252a31;--dot:#2f343c;--node-line:#5f6b7c;
 --blue:#4c90f0;--blue-d:#2d72d2;--blue-l:#1b2c45;--blue-t:#8abbff;--green:#32a467;--green-l:#17301f;--green-t:#72ca9b;--green-line:#2a5a3e;
 --orange:#ec9a3c;--orange-l:#3a2a14;--orange-t:#fbb360;--red:#e76a6e;--red-l:#3d1e20;--red-t:#fa999c;--red-line:#6b2c2e;
 --violet:#9881f3;--violet-l:#2a2440;--violet-t:#bdadff;--yellow-l:#3a3214;--yellow-t:#fbd065;--dark:#0b0d10;--dark2:#252a31;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#111418;--panel:#1c2127;--panel2:#252a31;--line:#383e47;--line2:#2f343c;--text:#e5e8eb;--text2:#c5cbd3;--muted:#abb3bf;--muted2:#8f99a8;
 --input-line:#4b535e;--hover:#2a3038;--tag:#2f343c;--code:#2a3038;--disabled:#252a31;--dot:#2f343c;--node-line:#5f6b7c;
 --blue:#4c90f0;--blue-d:#2d72d2;--blue-l:#1b2c45;--blue-t:#8abbff;--green:#32a467;--green-l:#17301f;--green-t:#72ca9b;--green-line:#2a5a3e;
 --orange:#ec9a3c;--orange-l:#3a2a14;--orange-t:#fbb360;--red:#e76a6e;--red-l:#3d1e20;--red-t:#fa999c;--red-line:#6b2c2e;
 --violet:#9881f3;--violet-l:#2a2440;--violet-t:#bdadff;--yellow-l:#3a3214;--yellow-t:#fbd065;--dark:#0b0d10;--dark2:#252a31;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4,p{margin:0 0 8px}h1{font-size:20px}h2{font-size:17px}h3{font-size:15px}h4{font-size:13px}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--input-line);background:var(--panel);border-radius:3px;padding:5px 11px;min-height:32px;white-space:nowrap}
button:hover:not(:disabled){background:var(--hover)}
button.primary{background:var(--blue);border-color:var(--blue-d);color:#fff}button.primary:hover:not(:disabled){background:var(--blue-d)}
button.danger{color:var(--red);border-color:var(--red-line)}button.danger.solid{background:var(--red);color:#fff;border-color:var(--red)}
button.ghost{border-color:transparent;background:transparent}
button.small{min-height:26px;padding:2px 8px;font-size:12.5px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{border:1px solid var(--input-line);border-radius:3px;padding:5px 8px;min-height:32px;background:var(--panel);width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:disabled,select:disabled{background:var(--disabled);color:var(--muted2)}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.fld{display:grid;gap:3px;min-width:0}.fld>span{font-size:12.5px;font-weight:600;color:var(--text2)}.fld small{color:var(--muted);font-weight:400}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer}.chk input{width:auto;min-height:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.row>.fld{flex:1 1 160px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}.small-t{font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:14px}
.card>h3:first-child,.card>.spread:first-child{margin-bottom:10px}
.note{background:var(--blue-l);border-left:3px solid var(--blue);padding:8px 12px;border-radius:2px;margin:10px 0;font-size:13px}
.note.warn{background:var(--orange-l);border-color:var(--orange)}.note.bad{background:var(--red-l);border-color:var(--red)}.note.ok{background:var(--green-l);border-color:var(--green)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:3px;background:var(--tag);color:var(--text2);white-space:nowrap;vertical-align:middle}
.tag.experimental{background:var(--orange-l);color:var(--orange-t)}.tag.active{background:var(--green-l);color:var(--green-t)}.tag.deprecated{background:var(--tag);color:var(--muted);text-decoration:line-through}
.tag.new{background:var(--blue-l);color:var(--blue-t)}.tag.mod{background:var(--violet-l);color:var(--violet-t)}.tag.del{background:var(--red-l);color:var(--red-t)}.tag.pk{background:var(--panel)3c4;color:var(--yellow-t)}.tag.title{background:var(--violet-l);color:var(--violet-t)}
.scroll{overflow:auto;max-width:100%}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line2);vertical-align:middle}th{background:var(--panel2);font-size:12.5px;color:var(--text2);font-weight:600;white-space:nowrap}td{white-space:nowrap}td.wrap{white-space:normal}
tr.sel td{background:var(--blue-l)}tr.click{cursor:pointer}tr.click:hover td{background:var(--hover)}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--panel2);border:1px dashed var(--line);border-radius:4px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;height:50px;padding:0 14px;background:var(--dark);color:#f6f7f9}
.top .brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}.top .brand b{font-size:15px}.top .brand span{font-size:11.5px;color:#abb3bf}
.top button{background:var(--dark2);border-color:#404854;color:#f6f7f9}.top button:hover:not(:disabled){background:#383e47}
.top button.primary{background:var(--blue);border-color:var(--blue)}
.top select{background:var(--dark2);border-color:#404854;color:#f6f7f9;min-height:30px;width:auto}
.menu-toggle{display:none}
.search{position:relative;flex:1;max-width:420px;margin-left:12px}.search input{background:var(--dark2);border-color:#404854;color:#fff;min-height:30px}
.search-res{position:absolute;top:36px;left:0;right:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 24px #0003;max-height:360px;overflow:auto;z-index:30}
.search-res a{display:flex;justify-content:space-between;gap:10px;padding:7px 11px;color:var(--text);border-bottom:1px solid var(--line2)}.search-res a:hover{background:var(--blue-l);text-decoration:none}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.dropdown{position:relative}.menu{position:absolute;right:0;top:36px;min-width:220px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 24px #0003;padding:4px;z-index:30}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text)}.menu button:hover{background:var(--blue-l)}.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
.save-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f5a623;margin-left:6px}
/* layout */
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 50px)}
nav.side{background:var(--panel2);border-right:1px solid var(--line);padding:10px 8px;overflow:auto}
nav.side h6{margin:14px 8px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2)}
nav.side h6:first-child{margin-top:4px}
nav.side a{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;border-radius:3px;color:var(--text)}
nav.side a:hover{background:var(--tag);text-decoration:none}nav.side a[aria-current]{background:var(--blue-l);color:var(--blue-t);font-weight:600}
nav.side a .cnt{font-size:11.5px;color:var(--muted2)}
main{padding:18px 22px 60px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.page-head p{margin:0}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.res-head{display:flex;gap:12px;align-items:center}
.icon{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:5px;font-size:18px;flex:none}
.icon.sm{width:24px;height:24px;font-size:13px;border-radius:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto}
.tabs a{padding:8px 13px;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap}.tabs a:hover{text-decoration:none;background:var(--tag)}.tabs a[aria-current]{color:var(--blue-t);border-color:var(--blue);font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:14px;align-items:start}.split>*,.explorer>*,.grid2>*,.grid3>*{min-width:0}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.checklist{list-style:none;padding:0;margin:0;counter-reset:s}
.checklist li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line2)}
.checklist li .n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--tag);font-size:12px;font-weight:700;flex:none}
.checklist li.done .n{background:var(--green);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--text)}.tile:hover{border-color:var(--blue);text-decoration:none}
.tile small{display:block;color:var(--muted)}
/* topology */
.topo{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:14px;background:var(--hover);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:12px 12px;border-radius:4px;margin:8px 0}
.node{background:var(--panel);border:1px solid var(--node-line);border-radius:4px;padding:6px 10px;text-align:center;min-width:96px}.node b,.node small{display:block}.node small{font-size:11px;color:var(--muted)}
.wire{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--blue-t);min-width:60px}.wire:before{content:"";display:block;width:100%;height:2px;background:var(--blue);margin:3px 0}
/* dialog */
dialog#modal{border:0;padding:0;border-radius:6px;box-shadow:0 18px 60px #0005;width:min(980px,calc(100vw - 24px));max-height:calc(100dvh - 24px);color:var(--text);background:var(--panel)}
dialog#modal.narrow{width:min(560px,calc(100vw - 24px))}
dialog#modal[open]{display:flex;flex-direction:column}
dialog::backdrop{background:#1c2127a8}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0}
.dlg-body{flex:1;min-height:0;overflow:auto;padding:16px}
.dlg-body.wiz{display:grid;grid-template-columns:200px minmax(0,1fr);padding:0}
.wiz-steps{list-style:none;margin:0;padding:12px 8px;background:var(--panel2);border-right:1px solid var(--line)}
.wiz-steps li{display:flex;gap:8px;align-items:center;padding:8px;border-radius:3px;color:var(--muted);font-size:13px}
.wiz-steps li .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--input-line);font-size:11.5px;flex:none;background:var(--panel)}
.wiz-steps li[aria-current]{background:var(--blue-l);color:var(--blue-t);font-weight:600}.wiz-steps li[aria-current] .n{background:var(--blue);border-color:var(--blue);color:#fff}
.wiz-steps li.done .n{background:var(--green);border-color:var(--green);color:#fff}
.wiz-main{padding:16px 20px;min-width:0}
.dlg-msg{padding:8px 16px;background:var(--red-l);color:var(--red-t);border-top:1px solid var(--red-line);font-size:13px}
.dlg-msg.ok{background:var(--green-l);color:var(--green-t);border-color:var(--green-line)}
.dlg-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.dlg-foot>div{display:flex;gap:8px;flex-wrap:wrap}
.opt-card{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;padding:11px;margin-bottom:8px;cursor:pointer}
.opt-card:has(input:checked){border-color:var(--blue);background:var(--blue-l)}.opt-card input{width:auto;min-height:0;margin-top:3px}
.opt-card.disabled{opacity:.55;cursor:not-allowed}
.opt-card b,.opt-card small{display:block}.opt-card small{color:var(--muted)}
.side-card{border:1px solid var(--line);border-radius:4px;padding:12px;background:var(--panel2)}
.api-prev{display:block;margin-top:6px;background:var(--blue-l);color:var(--blue-t)}
.icons{display:flex;gap:6px;flex-wrap:wrap}.icons label{cursor:pointer}.icons input{position:absolute;opacity:0;width:1px;height:1px}.icons input:checked+.icon{outline:2px solid var(--blue);outline-offset:1px}.icons input:focus-visible+.icon{outline:2px dashed var(--blue)}
.cond{border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:10px;background:var(--panel)}
.cond-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}
.res-list li{margin:3px 0}
.diff td.b{color:var(--red-t);text-decoration:line-through}.diff td.a{color:var(--green-t);font-weight:600}
.crit{list-style:none;padding:0;margin:8px 0}.crit li{padding:5px 8px;border-radius:3px;margin-bottom:3px;font-size:13px}.crit li.pass{background:var(--green-l)}.crit li.fail{background:var(--red-l)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1c2127;color:#fff;padding:9px 16px;border-radius:4px;box-shadow:0 6px 20px #0004;z-index:50;max-width:calc(100vw - 32px)}
.toast.bad{background:#ac2f33}.toast:empty{display:none}
.obj-list a{display:block;padding:7px 10px;border-bottom:1px solid var(--line2);color:var(--text)}.obj-list a[aria-current]{background:var(--blue-l);font-weight:600}.obj-list a:hover{text-decoration:none;background:var(--hover)}
.explorer{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.timeline{list-style:none;padding:0;margin:0}.timeline li{border-left:2px solid var(--blue);padding:4px 0 10px 12px;position:relative}.timeline li:before{content:"";position:absolute;left:-6px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
@media(max-width:860px){
 .layout{grid-template-columns:1fr}
 nav.side{display:none;position:fixed;inset:50px 0 0 0;z-index:15;width:min(290px,85vw);box-shadow:4px 0 20px #0003}
 nav.side.open{display:block}
 .menu-toggle{display:inline-block}
 .search{display:none}
 .top .brand span{display:none}
 .top-actions .user-lbl{display:none}
 main{padding:14px 16px 60px}
 .split,.explorer,.grid2,.grid3{grid-template-columns:1fr}
 .dlg-body.wiz{grid-template-columns:1fr}
 .wiz-steps{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
 .wiz-steps li{white-space:nowrap}
 .kv{grid-template-columns:1fr}.kv dt{margin-top:6px}
 .row button,.spread button{white-space:normal}
}
@media(max-width:520px){.top-actions .hide-sm{display:none}.top{gap:6px;padding:0 8px}}
.aip-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,.9fr);gap:16px;align-items:start}
.aip-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.aip-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 17px;border-bottom:1px solid var(--line);background:var(--panel2)}
.aip-card-head h2{margin:0}.aip-card-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.aip-card-head input{width:auto;min-height:36px}.aip-card-head label{white-space:nowrap}
.aip-transcript{min-height:245px;max-height:55vh;overflow:auto;padding:15px 17px}
.aip-empty{margin:12px 0;color:var(--muted);max-width:42ch}
.aip-turn{display:grid;gap:9px;margin-bottom:17px}.aip-question{justify-self:end;max-width:90%;background:var(--blue-l);color:var(--blue-t);border-radius:10px 10px 2px 10px;padding:8px 12px;overflow-wrap:anywhere}
.aip-reply{border:1px solid var(--line2);border-radius:2px 10px 10px 10px;padding:11px 12px;overflow-wrap:anywhere}.aip-reply p{margin:0 0 8px}.aip-reply p:last-child{margin:0}
.aip-reply .aip-message{white-space:pre-wrap}.aip-notice{color:var(--muted);font-size:12px}.aip-model-error{color:var(--red-t,var(--text))}
.aip-reply ul{padding-left:20px;margin:6px 0 10px}.aip-turn-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.aip-form{padding:12px 17px 15px;border-top:1px solid var(--line);background:var(--panel2)}
.aip-input-row{display:flex;align-items:stretch;gap:8px}.aip-form input,.aip-form button{min-height:44px}
.aip-example{margin:0 0 10px;white-space:normal;text-align:left;min-height:38px;color:var(--blue-t);border-color:var(--line);background:var(--blue-l)}
.aip-trace{list-style:none;margin:0;padding:14px 16px}.aip-trace li{position:relative;padding:0 0 14px 33px;min-width:0}
.aip-trace li:not(:last-child)::before{position:absolute;content:"";left:11px;top:25px;bottom:0;width:1px;background:var(--line)}
.aip-step-num{position:absolute;top:0;left:0;display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:var(--blue-l);color:var(--blue-t);font-weight:700}
.aip-step-head{display:flex;justify-content:space-between;gap:7px;align-items:baseline;flex-wrap:wrap}
.aip-step-detail{margin:4px 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.aip-records{display:grid;gap:4px;margin:6px 0 0}.aip-record{background:var(--panel2);border-radius:5px;border:1px solid var(--line2);padding:5px 8px;overflow-wrap:anywhere}
.aip-record span{color:var(--muted);font-size:12px}.aip-ready{margin-bottom:13px}.aip-ready p{margin:0}.aip-empty-trace{padding:18px;color:var(--muted)}
@media(max-width:930px){.aip-grid{grid-template-columns:1fr}.aip-transcript{max-height:48vh}}
@media(max-width:480px){.aip-card-head{flex-wrap:wrap}.aip-card-head,.aip-transcript,.aip-form{padding-left:11px;padding-right:11px}}
.action-kinds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:0 0 16px}
.action-kinds button{min-height:44px;padding:5px 7px;white-space:normal;overflow-wrap:anywhere}
.action-kinds button[aria-pressed="true"]{color:var(--blue-t);background:var(--blue-l);border-color:var(--blue);font-weight:650}
.action-kinds button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.action-scope{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 0 14px}
.action-scope .chk{min-height:32px}
.action-run-steps{margin:8px 0 12px;padding-inline-start:24px}

function typeOk(kind,value){
 const v=String(value??'')
 if(!v)return true
 if(kind==='Integer')return /^-?\d+$/.test(v)&&Number.isSafeInteger(Number(v))
 if(kind==='Double')return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(v)&&Number.isFinite(Number(v))
 if(kind==='Boolean')return /^(true|false)$/i.test(v)
 if(kind==='Date'){const d=new Date(v+'T00:00:00Z');return /^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(d.valueOf())&&d.toISOString().slice(0,10)===v}
 return true
}
function inferType(field,values){
 if(SUGGEST[field])return SUGGEST[field]
 const vs=values.filter(Boolean)
 if(field==='id'||!vs.length)return 'String'
 for(const t of ['Integer','Double','Date','Boolean'])if(vs.every(v=>typeOk(t,v)))return t
 return 'String'
}
function parseCSV(text){
 const out=[];let row=[],value='',quoted=false
 text=text.replace(/^﻿/,'')
 for(let i=0;i<=text.length;i++){
  const c=text[i]
  if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++}else quoted=!quoted;continue}
  if(!quoted&&(c===','||c==='\n'||c===undefined)){row.push(value.trim());value='';if(c!==','){if(row.some(Boolean))out.push(row);row=[]}continue}
  if(c!=='\r'&&c!==undefined)value+=c
 }
 if(quoted||!out.length||new Set(out[0]).size!==out[0].length||out[0].some(x=>!x)||out.slice(1).some(r=>r.length!==out[0].length))throw Error('CSV 需要唯一表头，且每行列数必须一致。')
 return {fields:out[0],rows:out.slice(1)}
}

 Agent:{fields:['id','name','phone','company'],rows:[['A01','王经纪','13900000001','安居地产'],['A02','刘经纪','13900000002','安居地产']]},

const emptyOnto=()=>({objectTypes:{},linkTypes:{},actionTypes:{},sharedProps:{},interfaces:{},groups:{}})

function fresh(){
 const datasets={}

 for(const [k,v] of Object.entries(sources))datasets[k]={...clone(v),path:'/'+WORKSPACE.name+'/datasets/'+k,rid:'ri.foundry.main.dataset.'+hex(8)}
 return {datasets,committed:emptyOnto(),working:emptyOnto(),valueTypes:{},functions:[],fnRepo:{source:newFnSource(),committed:'',tags:[]},fnMetrics:{},edits:{},linkEdits:{},logs:[],scenarios:[],actionRuns:[],seq:{},user:'manager',
  ui:{modal:null,wiz:null,msg:null,toast:null,nav:false,newMenu:false,more:false,search:'',recent:[],selProp:{},otFilter:'',dsSel:Object.keys(datasets)[0],demo:false}}
}
let S=fresh()
const W=()=>S.working, C=()=>S.committed

/* ============ Ontology 查询 ============ */
const otName=(id,onto=W())=>onto.objectTypes[id]?.name||id
const propOf=(ot,id)=>ot?.properties.find(p=>p.id===id)
const pkProp=ot=>propOf(ot,ot.primaryKey)
const readableProperties=ot=>ot.properties.filter(p=>p.visibility!=='hidden')
function ontologyReadScope(onto=C(),user=S.user){
 const types=Object.hasOwn(USERS,user)?onto.objectTypes:{}
 return {user,onto,types,objects:id=>Object.hasOwn(types,id)?objectsOf(id,onto):[]}
}
function objectsOf(otId,onto=C()){
 const ot=onto.objectTypes[otId];if(!ot)return []
 const ed=S.edits[otId]||{created:{},modified:{},deleted:[]}
 const out=[]
 if(ot.datasource&&S.datasets[ot.datasource]){
  const ds=S.datasets[ot.datasource]
  for(const r of (WORKSPACE_ID==='uk-lettings'?ukDatasetRows(ot.datasource,ds):ds.rows)){
   const o={};for(const p of ot.properties)o[p.id]=p.column?(r[ds.fields.indexOf(p.column)]??''):''
   const k=String(o[ot.primaryKey])
   if(ed.deleted.includes(k))continue
   out.push(ed.modified[k]?{...o,...ed.modified[k]}:o)
  }
 }
 for(const [k,o] of Object.entries(ed.created))if(!ed.deleted.includes(k))out.push(ed.modified[k]?{...o,...ed.modified[k]}:o)
 return out
}
const findObj=(otId,pk,onto=C())=>{const ot=onto.objectTypes[otId];return ot?objectsOf(otId,onto).find(o=>String(o[ot.primaryKey])===String(pk)):undefined}
const titleOf=(otId,o,onto=C())=>{const ot=onto.objectTypes[otId];return o?(o[ot?.titleKey]||o[ot?.primaryKey]||''):''}
const fkLinksFrom=(otId,onto=W())=>Object.values(onto.linkTypes).filter(l=>l.mode==='fk'&&l.a.objectType===otId)
function fkTargetOf(otId,propId,onto=W()){return fkLinksFrom(otId,onto).find(l=>l.fk.property===propId)?.b.objectType||''}
const linksOf=(otId,onto=W())=>Object.values(onto.linkTypes).filter(l=>l.a.objectType===otId||l.b.objectType===otId)
const sideOf=(l,otId)=>l.a.objectType===otId?'a':'b'
const other=s=>s==='a'?'b':'a'
function cardOf(l,toSide){ // 从另一端看向 toSide 的数量
 if(l.cardinality==='many-to-many')return 'many'
 if(l.cardinality==='one-to-one')return 'one'
 return toSide==='a'?'many':'one' // many-to-one: a(外键侧) 多 → b 一
}
/* 接口：interface reference 的值为「对象类型ID:主键」 */
const irefOf=(ot,pk)=>ot+':'+pk
const parseIref=v=>{const s=String(v??''),i=s.indexOf(':');return i<0?null:{ot:s.slice(0,i),pk:s.slice(i+1)}}
const implementsIf=(ot,ifaceId)=>!!ot?.interfaces.some(x=>x.iface===ifaceId)
const ifaceImpls=(ifaceId,onto=W())=>Object.values(onto.objectTypes).filter(o=>implementsIf(o,ifaceId))
const ifaceLocal=(ot,ifaceId,ip)=>ot?.interfaces.find(x=>x.iface===ifaceId)?.mapping[ip]||''
const isIfaceAction=at=>at.rules.some(r=>IFACE_RULES.includes(r.type)||INTERFACE_LINK_RULES.includes(r.type))
const ifaceActionOff=(ot,atId,ifaceId)=>!!ot?.interfaces.find(x=>x.iface===ifaceId)?.disabledActions?.includes(atId)
const isFnAction=at=>at.rules.some(r=>r.type==='function')
function actionTarget(at,onto=W()){
 const fn=at.rules.find(r=>r.type==='function')
 if(fn)return '函数 · '+fn.fn
 const ifs=[...new Set(at.rules.map(r=>r.interface).filter(Boolean))]
 if(ifs.length)return '接口 · '+ifs.map(i=>onto.interfaces[i]?.name||i).join('、')
 if(at.rules.some(r=>r.type==='applyScenario'))return 'Ontology 场景'
 return otName(at.objectType,onto)||'工作区'
}
const actionRuleNames=at=>[...at.rules.map(r=>RULES[r.type][0]),...(at.effects||[]).map(r=>ACTION_EFFECTS[r.type][0])]
/* 取对象参数（Object reference / Interface reference）上的属性 */
function paramObject(at,vals,pid,onto){
 const p=at.parameters.find(x=>x.id===pid);if(!p)return null
 if(p.type==='Object reference'){const t=onto.objectTypes[p.objectType];const o=t&&objectsOf(t.id,onto).find(o=>String(o[t.primaryKey])===String(vals[pid]));return o?{ot:t,obj:o,p}:null}
 if(p.type==='Interface reference'){const r=parseIref(vals[pid]),t=r&&onto.objectTypes[r.ot];const o=t&&objectsOf(t.id,onto).find(o=>String(o[t.primaryKey])===r.pk);return o?{ot:t,obj:o,p}:null}
 return null
}
function paramProp(at,vals,path,onto){
 const [pid,prop]=String(path).split('.'),x=paramObject(at,vals,pid,onto);if(!x)return undefined
 if(x.p.type==='Interface reference'){const local=ifaceLocal(x.ot,x.p.interface,prop);return local?x.obj[local]:undefined}
 return x.obj[prop]
}
function linkOptionsFor(ot,lc,onto=W()){
 return linksOf(ot.id,onto).filter(l=>{const s=sideOf(l,ot.id),o=other(s),tgt=onto.objectTypes[l[o].objectType]
  const okT=lc.targetKind==='interface'?implementsIf(tgt,lc.target):l[o].objectType===lc.target
  return okT&&(cardOf(l,o)==='many'?'MANY':'ONE')===lc.cardinality})
}
/* Join table 的配对 = 数据集行 + 通过 Action 新增的关联 − 删除的关联 */
function joinPairs(l){
 const ds=S.datasets[l.join?.dataset];if(!ds)return []
 const ia=ds.fields.indexOf(l.join.aCol),ib=ds.fields.indexOf(l.join.bCol)
 const E=S.linkEdits?.[l.id]||{added:[],removed:[]},key=p=>p[0]+'\u0001'+p[1],rm=new Set(E.removed.map(key))
 const out=ds.rows.map(r=>[String(r[ia]??''),String(r[ib]??'')]).filter(p=>!rm.has(key(p)))
 for(const p of E.added)if(!out.some(x=>key(x)===key(p)))out.push(p)
 return out
}
/* 从 fromSide 端的对象出发，取另一端关联对象 */
function linkedObjects(l,fromSide,obj,onto=C(),readObjects=id=>objectsOf(id,onto)){
 const from=l[fromSide],to=l[other(fromSide)]
 const fromOT=onto.objectTypes[from.objectType],toOT=onto.objectTypes[to.objectType]
 if(!fromOT||!toOT||!obj)return []
 const pk=String(obj[fromOT.primaryKey])
 const targets=readObjects(to.objectType)
 if(l.mode==='fk'){
  if(fromSide==='a'){const v=obj[l.fk.property];return v?targets.filter(t=>String(t[toOT.primaryKey])===String(v)):[]}
  return targets.filter(t=>String(t[l.fk.property])===pk)
 }
 if(l.mode==='join'){
  const [f,t]=fromSide==='a'?[0,1]:[1,0]
  const keys=new Set(joinPairs(l).filter(p=>p[f]===pk).map(p=>p[t]))
  return targets.filter(x=>keys.has(String(x[toOT.primaryKey])))
 }
 if(l.mode==='back'){
  const la=onto.linkTypes[fromSide==='a'?l.back.aLink:l.back.bLink],lb=onto.linkTypes[fromSide==='a'?l.back.bLink:l.back.aLink]
  if(!la||!lb)return []
  const middles=readObjects(l.back.middle).filter(m=>String(m[la.fk.property])===pk)
  const keys=new Set(middles.map(m=>String(m[lb.fk.property])))
  return targets.filter(t=>keys.has(String(t[toOT.primaryKey])))
 }
 return []
}

/* ============ 校验整个工作区（Review edits 的 Errors / Warnings） ============ */
function checkValueType(vtId,v){
 const vt=S.valueTypes[vtId];if(!vt||v===''||v==null)return ''
 const c=vt.constraint,s=String(v)
 let ok=true
 if(c.kind==='regex'){try{ok=new RegExp('^(?:'+c.pattern+')$').test(s)}catch{ok=false}}
 if(c.kind==='enum')ok=splitList(c.values).includes(s)
 if(c.kind==='range'){const n=vt.baseType==='String'?s.length:Number(s);ok=Number.isFinite(n)&&(c.min===''||n>=Number(c.min))&&(c.max===''||n<=Number(c.max))}
 return ok?'':(vt.message||'值不符合值类型 '+vt.name+' 的约束。')
}
function validateOnto(onto=W()){
 const errors=[],warnings=[]
 const E=(c,k,m)=>errors.push({c,k,m}),Wn=(c,k,m)=>warnings.push({c,k,m})
 const apiSeen={},dsSeen={}
 for(const [k,ot] of Object.entries(onto.objectTypes)){
  const c='objectTypes'
  if(!/^[a-z][a-z0-9-]*$/.test(ot.id))E(c,k,'ID 只能包含小写字母、数字和连字符，并以小写字母开头。')
  if(!ot.name)E(c,k,'缺少 Display name。')
  if(!ot.plural)E(c,k,'缺少 Plural display name。')
  if(!/^[A-Z][A-Za-z0-9]{0,99}$/.test(ot.apiName))E(c,k,'API name 须以大写字母开头，仅含字母数字（PascalCase），1–100 个字符。')
  else if(RESERVED.includes(ot.apiName.toLowerCase()))E(c,k,'API name 不能使用保留字 '+ot.apiName+'。')
  else if(apiSeen[ot.apiName])E(c,k,'API name '+ot.apiName+' 与 '+apiSeen[ot.apiName]+' 重复。');else apiSeen[ot.apiName]=ot.name
  if(ot.datasource){
   if(!S.datasets[ot.datasource])E(c,k,'Backing datasource '+ot.datasource+' 不存在。')
   else if(dsSeen[ot.datasource])E(c,k,'Phonograph2:DatasetAndBranchAlreadyRegistered — 数据源 '+ot.datasource+' 已支撑 '+dsSeen[ot.datasource]+'。');else dsSeen[ot.datasource]=ot.name
  }
  if(!ot.properties.length)E(c,k,'至少需要一个属性。')
  const pids=new Set(),papis=new Set()
  for(const p of ot.properties){

    input?.source==='param'?!!p&&!p.multiple:

   if(!valid)errors.push('Webhook 输入「'+label+'」需要有效的值来源。')
  }
 }
 return errors
}

function actionEffectSteps(at,vals,onto,types,steps,failures){
 let response={}
 for(const r of at.effects||[]){
  if(!types.includes(r.type))continue
  const name=ACTION_EFFECTS[r.type][0]
  if(r.type==='notification'){
   const recipients=Object.entries(USERS).filter(([id,u])=>r.audience==='current'?id===S.user:r.audience==='user'?id===r.recipient:u.groups.includes(r.recipient))
   steps.push({name,status:'已模拟发送',detail:recipients.map(([,u])=>u.name).join('、')+' · '+renderActionTemplate(r.template,at,vals,onto)})
   continue
  }
  if(r.type==='schedule'){
   const failed=r.result==='error'
   steps.push({name,status:failed?'启动失败':'已模拟启动',detail:r.dataset+(failed?'':' · BUILD-'+hex(8))})
   if(failed)failures.push('构建计划启动失败，Action 未提交对象编辑。')
   continue
  }
  const connector=DEMO_CONNECTORS[r.connector]
  const payload=Object.fromEntries(connector.inputs.map(([id])=>{
   const input=r.inputs[id]
   return [id,input.source==='static'?input.value:input.source==='objprop'?paramProp(at,vals,input.value,onto):vals[input.value]]
  }))
  const failed=r.result==='error'||Object.values(payload).some(value=>value==null||String(value).trim()==='')
  const output=failed?{}:{[connector.response]:connector.prefix+'-'+hex(8)}
  steps.push({name,status:failed?'请求失败':'已模拟调用',detail:connector.name+' · '+JSON.stringify(payload)+(failed?'':' → '+JSON.stringify(output))})
  if(r.type==='writeback'){
   if(failed)failures.push('Writeback Webhook 失败，Action 未提交对象编辑。')
   response=output
  }
 }
 return response
}

function renderActionTemplate(template,at,vals,onto){
 return template.replace(/\/([a-z][A-Za-z0-9_]*)(?:\.([A-Za-z0-9_-]+))?/g,(token,id,property)=>{
  const p=at.parameters.find(p=>p.id===id)
  if(!p)return token
  if(property)return String(paramProp(at,vals,id+'.'+property,onto)??'')
  const object=paramObject(at,vals,id,onto)
  return String(object?titleOf(object.ot.id,object.obj,onto):vals[id]??'')
 })
}

function recordActionRun(at,steps,failures){
 if(!steps.length)return
 S.actionRuns.unshift({at:at.name,time:new Date().toISOString(),user:S.user,status:failures.length?'未提交':'已提交',steps:clone(steps)})
 if(S.actionRuns.length>100)S.actionRuns.pop()
}

function scenarioEdits(rule,scenario,onto){
 if(!scenario||scenario.status!=='staged')throw Error('请选择未合并的场景。')
 const edits=scenario.edits.filter(e=>e.link?rule.linkTypes.includes(e.link):rule.objectTypes.includes(e.ot))
 if(!edits.length)throw Error('场景里没有落在此规则范围内的变更。')
 if(edits.length!==scenario.edits.length)throw Error('当前 Action 的合并范围未涵盖这个场景的全部变更。')
 for(const e of edits){
  if(e.link){
   const link=onto.linkTypes[e.link]
   if(!link||link.mode!=='join')throw Error('场景引用的关系类型已变更。')
   if(joinPairs(link).some(([a,b])=>a===e.a&&b===e.b)!==(e.type==='deleteLink'))throw Error('场景中的关系已被修改，请重新准备。')
  }else{
   const current=findObj(e.ot,e.pk,onto)
   if(!onto.objectTypes[e.ot]||JSON.stringify(current??null)!==JSON.stringify(e.before??null))throw Error('场景对象 '+e.pk+' 已被修改，请重新准备。')
  }
 }
 return clone(edits)
}

function interfaceLinkEdits(rule,at,vals,onto,edits){
 const source=paramObject(at,vals,rule.objectParam,onto),target=paramObject(at,vals,rule.targetParam,onto)
 if(!source||!target)throw Error('请选择接口关系两端的对象。')
 if(ifaceActionOff(source.ot,at.id,rule.interface))throw Error('此对象类型禁用了该接口动作。')
 const linkId=source.ot.interfaces.find(i=>i.iface===rule.interface)?.links?.[rule.constraint]
 const link=onto.linkTypes[linkId]
 const create=rule.type==='createIfaceLink'
 const side=['a','b'].find(s=>link?.[s].objectType===source.ot.id&&link?.[other(s)].objectType===target.ot.id)
 if(!side)throw Error('两端对象没有实现选中的接口关系约束。')
 const sourcePk=String(source.obj[source.ot.primaryKey]),targetPk=String(target.obj[target.ot.primaryKey])
 const [a,b]=side==='a'?[sourcePk,targetPk]:[targetPk,sourcePk]
 if(link.mode==='join'){
  const exists=joinPairs(link).some(p=>p[0]===a&&p[1]===b)
  if(exists===create)throw Error(create?'关联已存在。':'关联不存在。')
  edits.push({type:create?'createLink':'deleteLink',link:link.id,a,b})
  return
 }
 if(link.mode!=='fk')throw Error('这条关联由中间对象维护，请通过该中间对象的 Action 更新。')
 const owner=side==='a'?source:target
 const fk=link.fk.property
 const prior=edits.find(e=>e.ot===owner.ot.id&&String(e.pk)===a&&e.after)
 const before=prior?.after||owner.obj
 if(!create&&String(before[fk]??'')!==b)throw Error('关联不存在。')
 const after={...before,[fk]:create?b:''}
 if(prior)prior.after=after
 else edits.push({type:'modify',ot:owner.ot.id,pk:a,before,after})
}

function defaultValues(at,ctx,onto){
 const vals={}
 for(const p of at.parameters){
  const d=p.default||{kind:'none'}
  let v=''
  if(d.kind==='static')v=d.value
  if(d.kind==='currentUser')v=S.user
  if(d.kind==='uuid')v=crypto.randomUUID?crypto.randomUUID():hex(8)+'-'+hex(4)+'-4'+hex(3)+'-a'+hex(3)+'-'+hex(12)
  if(ctx?.pk&&p.type==='Object reference'&&p.objectType===ctx.ot&&d.kind==='currentObject')v=ctx.pk
  if(ctx?.pk&&p.type==='Interface reference'&&d.kind==='currentObject'&&implementsIf(onto.objectTypes[ctx.ot],p.interface))v=irefOf(ctx.ot,ctx.pk)
  if(ctx?.ot&&!ctx.pk&&p.type==='Object type'&&implementsIf(onto.objectTypes[ctx.ot],p.interface))v=ctx.ot
  vals[p.id]=v
 }
 for(const p of at.parameters)if(p.default?.kind==='objprop')vals[p.id]=paramProp(at,vals,p.default.value,onto)??''
 return vals
}
function evaluateAction(at,vals,onto=C(),{dry=true}={}){
 const failures=[],crit=[],edits=[],steps=[],mergedScenarios=[]
 const cache={}
 const objs=id=>cache[id]??=objectsOf(id,onto)
 vals={...vals}
 // Identity-prefilled hidden parameters are rebound at execution, including
 // forms opened before a role switch and AI-provided drafts.
 for(const p of at.parameters)if(p.hidden&&p.default?.kind==='currentUser')vals[p.id]=S.user
 const ref=path=>{
  const [pid,prop]=String(path).split('.'),p=at.parameters.find(x=>x.id===pid)
  if(!p)return undefined
  if(!prop)return vals[pid]
  return paramProp(at,vals,path,onto)
 }
 for(const p of at.parameters)if(p.hidden&&p.default?.kind==='objprop')vals[p.id]=ref(p.default.value)??''
 const eff=effectiveParams(at,vals,onto)
 for(const p of eff){
  const items=p.multiple?listOf(vals[p.id]):(vals[p.id]===''||vals[p.id]==null?[]:[vals[p.id]])
  if(!items.length){if(p.required)failures.push('参数「'+p.name+'」为必填。');continue}
  const choices=paramChoices(at,p,vals,onto)
  for(const v of items){
  if(choices&&!choices.includes(String(v)))failures.push('参数「'+p.name+'」的值「'+v+'」不在允许的范围内。')
  if(p.type==='Object reference'){const t=onto.objectTypes[p.objectType];if(!t||!objs(p.objectType).some(o=>String(o[t.primaryKey])===String(v)))failures.push('参数「'+p.name+'」引用的对象不存在。')}
  else if(p.type==='Interface reference'){const r=parseIref(v),t=r&&onto.objectTypes[r.ot];if(!t||!implementsIf(t,p.interface)||!objs(t.id).some(o=>String(o[t.primaryKey])===r.pk))failures.push('参数「'+p.name+'」必须是实现了接口的对象。')}
  else if(p.type==='Object type'){if(!implementsIf(onto.objectTypes[v],p.interface))failures.push('参数「'+p.name+'」必须是实现了接口的对象类型。')}
  else if(!typeOk(p.type,v))failures.push('参数「'+p.name+'」不是有效的 '+p.type+'。')
  }
 }
 const criteria=evalCondList(at.criteria,at.criteriaMode||'all',{at,vals,onto})
 crit.push(...criteria.results)
 crit.pass=criteria.pass
 if(!crit.pass){
  const bad=at.criteriaMode==='none'?crit.filter(c=>c.pass):crit.filter(c=>!c.pass)
  for(const c of bad)failures.push(c.message||'提交条件未满足：'+c.label)
 }
 failures.push(...actionEffectErrors(at,onto))
 if(failures.length)return {failures,crit,edits,vals,steps}
 const writeback=actionEffectSteps(at,vals,onto,['writeback'],steps,failures)
 if(failures.length){
  if(!dry)recordActionRun(at,steps,failures)
  return {failures,crit,edits,vals,steps}
 }
 const mapValue=(m,rot)=>{
  if(m.source==='param')return vals[m.value]??''
  if(m.source==='static')return m.value
  if(m.source==='objprop')return ref(m.value)??''
  if(m.source==='user')return S.user
  if(m.source==='time')return today()
  if(m.source==='writeback')return writeback[m.value]??''
  return ''
 }
 for(const r of at.rules){
  if(r.type==='applyScenario'){
   try{
    const scenario=S.scenarios.find(s=>s.id===vals[r.scenarioParam])
    const staged=scenarioEdits(r,scenario,onto)
    edits.push(...staged)
    mergedScenarios.push(scenario)
   }catch(error){failures.push(error.message)}
   continue
  }
  if(INTERFACE_LINK_RULES.includes(r.type)){
   try{interfaceLinkEdits(r,at,vals,onto,edits)}catch(error){failures.push(error.message)}
   continue
  }
  if(r.type==='function'){
   const rs=fnResolve(r)
   if(!rs){failures.push('函数 '+r.fn+'@'+r.version+' 不存在。');continue}
   if(rs.meta.kind!=='edit'){failures.push('版本 '+rs.version+' 不是 Ontology Edit Function。');continue}
   const invalid=rs.meta.inputs.find(inp=>{
    const id=r.inputs?.[inp.name]
    return id?!fnInputMatches(inp,at.parameters.find(p=>p.id===id),onto):!inp.optional
   })
   if(invalid){failures.push(r.fn+'@'+rs.version+' 的输入 '+invalid.name+' 需要重新映射参数。');continue}
   const raw=Object.fromEntries(rs.meta.inputs.map(inp=>[inp.name,vals[r.inputs?.[inp.name]]??'']))
   const res=runFunction(rs.meta,raw,onto,{edit:true})
   if(!dry)fnRecord(r.fn,res)
   const run={name:'Function',status:'执行成功',detail:r.fn+'@'+rs.version+' · '+res.edits.length+' 项对象或关系编辑'}
   steps.push(run)
   if(!res.ok){run.status='执行失败';run.detail=r.fn+'@'+rs.version;failures.push(res.userFacing?res.error:'函数执行失败：'+res.error);continue}
   const declared=new Set((fnVersionMeta(r.fn,r.version)||rs.meta).edits),bad=new Set()
   for(const e of res.edits){const types=e.link?[onto.linkTypes[e.link].a.objectType,onto.linkTypes[e.link].b.objectType]:[e.ot];for(const t of types){const api=onto.objectTypes[t]?.apiName;if(!declared.has(api))bad.add(api)}}
   if(bad.size){run.status='编辑范围校验失败';failures.push('Provenance：函数编辑了 @Edits 中没有声明的对象类型 '+[...bad].join('、')+'，动作失败。');continue}
   edits.push(...res.edits);continue
  }
  if(IFACE_RULES.includes(r.type)){
   const it=onto.interfaces[r.interface]
   if(!it){failures.push('规则引用的接口不存在。');continue}
   if(r.type==='createIface'){
    const rot=onto.objectTypes[vals[r.typeParam]]
    if(!implementsIf(rot,it.id)){failures.push('请选择实现了「'+it.name+'」的对象类型。');continue}
    if(ifaceActionOff(rot,at.id,it.id)){failures.push(rot.name+' 已在 Interface action control 中禁用此动作。');continue}
    if(!r.mappings.some(m=>ifaceLocal(rot,it.id,m.prop)===rot.primaryKey)){failures.push(rot.name+' 的主键 '+rot.primaryKey+' 没有通过接口属性映射，无法用接口动作创建。');continue}
    const after={};for(const p of rot.properties)after[p.id]=''
    for(const m of r.mappings){const local=ifaceLocal(rot,it.id,m.prop);if(local)after[local]=String(mapValue(m,rot)??'')}
    edits.push({type:'create',ot:rot.id,pk:after[rot.primaryKey],before:null,after})
    continue
   }
   const x=paramObject(at,vals,r.objectParam,onto)
   if(!x){failures.push('未找到要'+(r.type==='deleteIface'?'删除':'修改')+'的对象。');continue}
   const rot=x.ot,pk=String(x.obj[rot.primaryKey])
   if(ifaceActionOff(rot,at.id,it.id)){failures.push(rot.name+' 已在 Interface action control 中禁用此动作。');continue}
   if(r.type==='deleteIface'){edits.push({type:'delete',ot:rot.id,pk,before:x.obj,after:null});continue}
   const prior=edits.find(e=>e.ot===rot.id&&String(e.pk)===pk),before=prior?.after||x.obj,after={...before}
   let bad=false
   for(const m of r.mappings){const local=ifaceLocal(rot,it.id,m.prop);if(!local)continue;if(local===rot.primaryKey){failures.push('接口属性 '+m.prop+' 映射到 '+rot.name+' 的主键，主键不能被修改。');bad=true;continue}after[local]=String(mapValue(m,rot)??'')}
   if(bad)continue
   if(prior)prior.after=after;else edits.push({type:'modify',ot:rot.id,pk,before,after})
   continue
  }
  if(LINK_RULES.includes(r.type)){
   const l=onto.linkTypes[r.linkType]
   if(!l||l.mode!=='join'){failures.push('规则引用的多对多关系不存在。');continue}
   const a=String(vals[r.aParam]??''),b=String(vals[r.bParam]??'')
   if(!a||!b){failures.push('请选择要'+(r.type==='createLink'?'关联':'解除关联')+'的两端对象。');continue}
   const linked=joinPairs(l).some(p=>p[0]===a&&p[1]===b)
   if(r.type==='createLink'&&linked)failures.push('这两个对象已经通过「'+l.a.displayName+' ↔ '+l.b.displayName+'」关联。')
   if(r.type==='deleteLink'&&!linked)failures.push('这两个对象之间没有「'+l.a.displayName+' ↔ '+l.b.displayName+'」关联。')
   edits.push({type:r.type,link:l.id,a,b})
   continue
  }
  const rot=onto.objectTypes[r.objectType||at.objectType]
  if(!rot){failures.push('规则引用的对象类型不存在。');continue}
  const create=()=>{
   const after={};for(const p of rot.properties)after[p.id]=''
   for(const m of r.mappings)after[m.prop]=String(mapValue(m,rot)??'')
   if(r.type==='createOrModify'&&!r.mappings.some(m=>m.prop===rot.primaryKey))after[rot.primaryKey]=crypto.randomUUID?crypto.randomUUID():hex(8)+'-'+hex(4)+'-'+hex(4)+'-'+hex(4)+'-'+hex(12)
   edits.push({type:'create',ot:rot.id,pk:after[rot.primaryKey],before:null,after})
   for(const lk of r.links||[]){
    const l=onto.linkTypes[lk.linkType];if(!l)continue
    const s=l.a.objectType===rot.id?'a':'b',targets=listOf(vals[lk.param])
    for(const t of targets){const [a,b]=s==='a'?[String(after[rot.primaryKey]),String(t)]:[String(t),String(after[rot.primaryKey])];edits.push({type:'createLink',link:l.id,a,b})}
   }
  }
  if(r.type==='create'){create();continue}
  const op=at.parameters.find(p=>p.id===r.objectParam)
  const pks=op?.multiple?listOf(vals[r.objectParam]):[vals[r.objectParam]].filter(x=>x!==''&&x!=null)
  if(!pks.length){if(r.type==='createOrModify')create();else if(op?.required)failures.push('请选择要修改的'+rot.name+'。');continue}
  for(const pk of pks){
   const prior=edits.find(e=>e.ot===rot.id&&String(e.pk)===String(pk))
   const before=prior?.after||objs(rot.id).find(o=>String(o[rot.primaryKey])===String(pk))
   if(!before){failures.push('未找到要修改的'+rot.name+'「'+(pk||'')+'」。');continue}
   if(r.type==='delete'){edits.push({type:'delete',ot:rot.id,pk,before,after:null});continue}
   const after={...before};for(const m of r.mappings){if(m.prop===rot.primaryKey&&r.type==='createOrModify')continue;after[m.prop]=String(mapValue(m,rot)??'')}
   if(prior)prior.after=after;else edits.push({type:'modify',ot:rot.id,pk,before,after})
  }
 }
 // Ontology 完整性
 for(const e of edits){
  if(!e.after)continue
  const eot=onto.objectTypes[e.ot]
  for(const p of eot.properties){
   const v=e.after[p.id]
   if(!typeOk(p.baseType,v))failures.push(eot.name+'.'+p.name+' 的值「'+v+'」不是有效的 '+p.baseType+'。')
   const vt=checkValueType(p.valueType,v);if(vt)failures.push(vt)
  }
  if(e.type==='create'){
   if(!e.pk)failures.push('新对象的主键不能为空。')
   else if(objs(eot.id).some(o=>String(o[eot.primaryKey])===String(e.pk)))failures.push('主键 '+e.pk+' 已存在。')
  }
 }
 if(!failures.length)actionEffectSteps(at,vals,onto,['schedule'],steps,failures)
 const afterCommit=[]
 if(!failures.length){
  if(steps.length||at.effects?.length||mergedScenarios.length)steps.push({name:'Ontology',status:dry?'计划提交':'已提交',detail:edits.length+' 项对象或关系编辑'})
  actionEffectSteps(at,vals,onto,['webhook','notification'],afterCommit,failures)
 }
 if(!dry&&!failures.length){
  const vkey=e=>e.link?'link|'+e.link+'|'+e.a+'|'+e.b:e.ot+'|'+e.pk
  S.objVer??={}
  for(const e of edits)S.objVer[vkey(e)]=(S.objVer[vkey(e)]||0)+1
  S.lastSubmission={at:at.id,user:S.user,time:Date.now(),edits:clone(edits),ver:Object.fromEntries(edits.map(e=>[vkey(e),S.objVer[vkey(e)]])),logRid:null}
  for(const e of edits){
   if(e.link){
    const L=(S.linkEdits??={})[e.link]??={added:[],removed:[]},same=p=>p[0]===e.a&&p[1]===e.b
    if(e.type==='createLink'){if(L.removed.some(same))L.removed=L.removed.filter(p=>!same(p));else L.added.push([e.a,e.b])}
    else{if(L.added.some(same))L.added=L.added.filter(p=>!same(p));else L.removed.push([e.a,e.b])}
    continue
   }
   const E=S.edits[e.ot]??={created:{},modified:{},deleted:[]}
   if(e.type==='create')E.created[e.pk]=e.after
   if(e.type==='modify'){if(E.created[e.pk])E.created[e.pk]=e.after;else E.modified[e.pk]=e.after}
   if(e.type==='delete')E.deleted.push(String(e.pk))
  }
  for(const scenario of mergedScenarios)scenario.status='merged'
  if(at.actionLog.enabled&&!isIfaceAction(at)){
   S.lastSubmission.logRid='ri.actions.main.action.'+hex(8)
   S.logs.unshift({logType:'[Log] '+at.name,at:at.id,actionRid:S.lastSubmission.logRid,actionTypeRid:at.rid,version:at.version,timestamp:new Date().toISOString(),user:S.user,
    edited:edits.map(e=>e.link?{link:e.link,pk:e.a+' ↔ '+e.b,type:e.type}:{ot:e.ot,pk:e.pk,type:e.type}),params:{...vals},summary:renderSummary(at,vals,onto)})
  }
 }
 steps.push(...afterCommit)
 if(!dry)recordActionRun(at,steps,failures)
 return {failures,crit,edits,vals,steps}
}
function paramLabel(at,path){
 const [pid,prop]=String(path).split('.'),p=at.parameters.find(x=>x.id===pid)
 if(!p)return path
 if(!prop)return p.name
 if(p.type==='Interface reference')return p.name+'.'+((W().interfaces[p.interface]||C().interfaces[p.interface])?.properties.find(x=>x.apiName===prop)?.name||prop)
 return p.name+'.'+(propOf(W().objectTypes[p.objectType]||C().objectTypes[p.objectType],prop)?.name||prop)
}
function renderSummary(at,vals,onto){
 return String(at.actionLog.summary||'').replace(/\/([a-z][A-Za-z0-9_]*)/g,(m,id)=>{
  const p=at.parameters.find(x=>x.id===id);if(!p)return m
  const v=vals[id]
  if(p.type==='Object reference'){const o=findObj(p.objectType,v,onto),t=o?titleOf(p.objectType,o,onto):'';return t&&t!==v?t+'（'+v+'）':v}
  if(p.type==='Interface reference'){const r=parseIref(v),o=r&&findObj(r.ot,r.pk,onto);return o?titleOf(r.ot,o,onto)+'（'+r.pk+'）':v}
  return v
 })
}

const mkOT=o=>({rid:newRid('object-type'),description:'',groups:[],status:'experimental',visibility:'normal',location:PROJECTS[0],interfaces:[],...o})

const mkMap=(prop,source,value='')=>({prop,source,value})
const mkAT=o=>({rid:newRid('action-type'),description:'',status:'experimental',location:PROJECTS[0],version:0,criteriaMode:'all',criteria:[],actionLog:{enabled:true,summary:''},...o})
function loadConfiguredWorkspace(){
 if(WORKSPACE_ID==='rental-demo'){initializeRentalDemo();return}
 if(!WORKSPACE.types)return
 const onto=emptyOnto()
 for(const t of WORKSPACE.types){
  const {id,apiName,name,icon,properties}=t
  onto.objectTypes[id]=mkOT({id,apiName,name,plural:name,icon,color:COLORS[0],datasource:apiName,
   description:t.description||'',
   primaryKey:t.primaryKey||'id',titleKey:t.title||'name',properties:properties.map(([id,label,type,extra])=>mkProp(id,label,type,extra))})
 }
 for(const l of WORKSPACE.links){
  const endpoint=(objectType,[displayName,apiName])=>({objectType,displayName,apiName,plural:displayName,visibility:'normal'})
  onto.linkTypes[l.id]={id:l.id,rid:newRid('link-type'),mode:'fk',cardinality:'many-to-one',status:'experimental',location:PROJECTS[0],
   a:endpoint(l.from,l.reverse),b:endpoint(l.to,l.forward),fk:{property:l.property},join:null,back:null}
 }
 for(const definition of WORKSPACE.actionTypes){
  const at=clone(definition)
  const parameters=at.parameters.map(p=>mkParam(p.id,p.name,p.type,p))
  onto.actionTypes[at.id]=mkAT({...at,parameters,version:1})
 }
 S.committed=onto
 S.working=clone(onto)
 if(WORKSPACE_ID==='loftyworks'){
  const compiled=compileRepo(LOFTY_FUNCTION_SOURCE,onto)
  if(compiled.errors.length)throw Error(compiled.errors.join('\n'))
  S.fnRepo={source:LOFTY_FUNCTION_SOURCE,committed:LOFTY_FUNCTION_SOURCE,tags:[{version:'1.0.0',time:new Date().toISOString(),source:LOFTY_FUNCTION_SOURCE,functions:compiled.functions}]}
  S.loftyModelVersion=LOFTY_MODEL_VERSION
  ROUTE='loftyworks'
 }
}

}

   if(d.target==='interface')config=fSel(P+'iface','Interface',[['','选择接口'],...Object.values(W().interfaces).map(i=>[i.id,i.name])],d.iface,'data-after="atIfaceReset"')+
    ruleOptions([...IFACE_RULES,...INTERFACE_LINK_RULES],'irule','atIfaceReset')+(INTERFACE_LINK_RULES.includes(d.irule)?fSel(P+'constraint','Link type constraint',[['','选择关系约束'],...(it?.linkConstraints||[]).map(l=>[l.apiName,l.apiName])],d.constraint):'')
   if(d.target==='notification')config=renderActionEffect(d.effects.notification,effectPath('notification'),null,true)
   if(d.target==='scenario')config=actionScopeFields({objectTypes:scopeSelections(d.scope.objectTypes),linkTypes:scopeSelections(d.scope.linkTypes)},P+'scope')

  if(step===1){

     '<p class="muted">函数声明编辑的类型 · '+esc(meta?.edits.join('、')||'—')+'</p>'+
     fSel(P+'functionTarget','在业务台展示到',[['','工作区级动作'],...objectOptions],d.functionTarget)

   if(d.target==='webhook')return renderActionEffect(d.effects[d.mode],effectPath(d.mode))
   if(d.target==='notification')return renderActionEffect(d.effects.notification,effectPath('notification'))
   if(d.target==='advanced')return renderActionEffect(d.effects.schedule,effectPath('schedule'))
   if(d.target==='scenario')return '<p class="note">表单会生成「场景」参数。可在 Object Explorer 把一次试运行保存为场景，再回到这个动作进行合并。</p>'
   if(d.target==='interface'&&(d.irule==='deleteIface'||INTERFACE_LINK_RULES.includes(d.irule)))return '<p class="note">'+(d.irule==='deleteIface'?'表单会生成一个接口对象参数。':'表单会按关系约束生成两端参数，执行时解析对应的具体 Link。')+'</p>'
   if(d.target==='object'&&d.rule==='delete')return '<p class="note">表单会生成一个引用 '+esc(ot.name)+' 的对象参数。</p>'
   const onInterface=d.target==='interface',mappings=onInterface?d.imaps:d.mappings,key=onInterface?'imaps':'mappings'
   const props=(onInterface?it.properties:ot.properties).map(p=>({...p,field:onInterface?p.apiName:p.id}))
   const unused=props.filter(p=>!mappings.some(m=>m.prop===p.field)&&(onInterface||d.rule==='create'||p.field!==ot.primaryKey))
   return '<p class="muted">每个属性默认生成一个 Action 参数，也可选择固定值、当前用户或时间。</p>'+
    table(['Property','Value source',''],mappings.map((m,i)=>{
     const p=props.find(p=>p.field===m.prop),base=P+key+'.'+i
     return [esc(p?.name||m.prop)+' <code>'+esc(m.prop)+'</code>',
      fSel(base+'.source','来源',SOURCES.filter(([s])=>s!=='objprop'),m.source)+(m.source==='static'?fInp(base+'.value','固定值',m.value||''):''),
      B(onInterface?'wizRemoveIMap':'wizRemoveMap','移除','small ghost',String(i),!onInterface&&d.rule==='create'&&m.prop===ot.primaryKey?'disabled':'')]
    }),'尚未选择属性')+
    (unused.length?'<div class="row"><label class="fld"><span>Add property</span><select id="'+(onInterface?'wizAddIMapSel':'wizAddMapSel')+'">'+options(unused.map(p=>[p.field,p.name]))+'</select></label>'+B(onInterface?'wizAddIMap':'wizAddMap','＋ Add property')+'</div>':'')
  }
  if(step===2)return '<div class="grid2">'+fInp(P+'name','Action type name',d.name,'data-after="atName"')+fInp(P+'apiName','API name',d.apiName,'data-after="atApi"')+'</div>'+fArea(P+'description','Description',d.description)
  if(step===3)return '<p class="muted">选择可以提交这个 Action 的用户组。更多条件可在动作详情中设置。</p><div class="action-scope">'+USER_GROUPS.map(([id,label])=>'<label class="chk"><input type="checkbox" data-change="wizToggleGroupCrit" data-arg="'+id+'" '+(d.groups.includes(id)?'checked':'')+'> '+esc(label)+'</label>').join('')+'</div>'
  return fSel(P+'location','Save location',projOpts,d.location)+'<p class="muted">创建后会进入 Action 详情。点击工作台顶部 Save 发布，才能从业务台执行。</p>'
 },
 next(d,step){
  const ot=W().objectTypes[d.objectType],it=W().interfaces[d.iface]
  if(step===0){
   if(d.target==='object'&&!ot)throw Error('请选择对象类型。')
   if(d.target==='link'&&!actionJoins().some(l=>l.id===d.linkType))throw Error('请选择一个 Join table 多对多关系。')
   if(d.target==='function'&&fnVersionMeta(d.functionId,d.functionVersion)?.kind!=='edit')throw Error('请选择已发布的 Ontology Edit Function 和版本。')
   if(d.target==='interface'&&(!it||INTERFACE_LINK_RULES.includes(d.irule)&&!it.linkConstraints?.some(l=>l.apiName===d.constraint)))throw Error('请选择接口和所需的关系约束。')
   if(d.target==='scenario'&&!scopeSelections(d.scope.objectTypes).length&&!scopeSelections(d.scope.linkTypes).length)throw Error('至少选择一个对象类型或关系类型。')
  }
  if(step===1){
   if(d.target==='object'&&d.rule!=='delete'){
    if(!d.mappings.length)throw Error('至少选择一个属性。')
    if(d.rule==='create'&&!d.mappings.some(m=>m.prop===ot.primaryKey))throw Error('Create object 需要为主键提供值。')
   }
   if(d.target==='interface'&&['createIface','modifyIface'].includes(d.irule)&&!d.imaps.length)throw Error('至少选择一个接口属性。')
   if(d.target==='webhook'){
    const effect=clone(d.effects[d.mode]),temp={effects:[effect],parameters:[]}
    materializeWebhookInputs(temp,effect)
    const errors=actionEffectErrors(temp,W())
    if(errors.length)throw Error(errors.join(' '))
   }
   if(d.target==='notification'||d.target==='advanced'){
    const errors=actionEffectErrors({effects:[d.effects[d.target==='notification'?'notification':'schedule']],parameters:[]},W())
    if(errors.length)throw Error(errors.join(' '))
   }
  }
  if(step===2){
   d.name=d.name.trim();d.apiName=d.apiName.trim()
   if(!d.name)throw Error('请输入 Action type name。')
   if(!/^[a-z][A-Za-z0-9]{0,99}$/.test(d.apiName))throw Error('API name 须为 camelCase。')
   if(Object.values(W().actionTypes).some(a=>a.apiName===d.apiName))throw Error('Action API name 已存在，请使用不同名称。')
  }
  if(step===3&&!d.groups.length)throw Error('至少选择一个用户组。')
  if(step===4&&!PROJECTS.includes(d.location))throw Error('请选择保存位置。')
 },
 finish(d){
  let id=toKebab(d.apiName);while(W().actionTypes[id]||C().actionTypes[id])id+='-2'
  const at=mkAT({id,apiName:d.apiName,name:d.name,description:d.description,objectType:'',location:d.location,
   parameters:[],rules:[],effects:[],criteria:[{kind:'user',groups:[...d.groups],message:'当前用户不能执行此动作。'}]})
  if(d.target==='object'){
   const ot=W().objectTypes[d.objectType]
   at.objectType=ot.id
   const rule={type:d.rule,objectType:ot.id,objectParam:'',mappings:[]}
   if(d.rule!=='create'){
    rule.objectParam=appendRefParam(at,'Object reference',ot.id,ot.name,'currentObject')
    at.parameters[0].required=d.rule!=='createOrModify'
   }
   for(const m of d.mappings){
    const pr=paramFor(ot,propOf(ot,m.prop))
    if(m.source!=='param'){rule.mappings.push(mkMap(m.prop,m.source,m.value||''));continue}
    while(at.parameters.some(p=>p.id===pr.id))pr.id+='_2'
    pr.required=true
    at.parameters.push(pr)
    rule.mappings.push(mkMap(m.prop,'param',pr.id))
   }
   at.rules.push(rule)
  }
  if(d.target==='link'){
   const link=W().linkTypes[d.linkType]
   at.objectType=link.a.objectType
   const aParam=appendRefParam(at,'Object reference',link.a.objectType,otName(link.a.objectType)+' · A','currentObject')
   const bParam=appendRefParam(at,'Object reference',link.b.objectType,otName(link.b.objectType)+' · B')
   at.rules.push({type:d.linkRule,linkType:link.id,aParam,bParam,mappings:[]})
  }
  if(d.target==='function'){
   at.objectType=d.functionTarget
   bindEditFunction(at,d.functionId,d.functionVersion,d.autoUpgrade,d.fnInputs)
  }
  if(d.target==='interface'){
   const it=W().interfaces[d.iface]
   if(INTERFACE_LINK_RULES.includes(d.irule))bindInterfaceLink(at,d.irule,d.iface,d.constraint)
   else{
    const rule={type:d.irule,interface:it.id,mappings:[]}
    if(d.irule==='createIface'){
     const tp=mkParam(toParamId(toCamel(it.apiName)+'Type'),it.name+'类型','Object type',{interface:it.id})
     at.parameters.push(tp);rule.typeParam=tp.id
    }else rule.objectParam=appendRefParam(at,'Interface reference',it.id,it.name,'currentObject')
    for(const m of d.imaps)rule.mappings.push(m.source==='param'?mkMap(m.prop,'param',ensureIfaceParam(at,it,m.prop)):mkMap(m.prop,m.source,m.value||''))
    at.rules.push(rule)
   }
   at.actionLog.enabled=false
  }
  if(d.target==='scenario'){
   bindScenario(at,scopeSelections(d.scope.objectTypes),scopeSelections(d.scope.linkTypes))
   at.allowRevert=false
  }
  if(d.target==='webhook'||d.target==='notification'||d.target==='advanced'){
   const kind=d.target==='webhook'?d.mode:d.target==='notification'?'notification':'schedule'
   const rule=clone(d.effects[kind])
   if(d.target==='webhook')materializeWebhookInputs(at,rule)
   at.effects.push(rule)
  }
  at.actionLog.summary=d.name+(at.parameters[0]?' /'+at.parameters[0].id:'')
  W().actionTypes[id]=at
  return 'action-types/'+id
 }
}

WIZ.implement={title:'Implement interface',steps:['Select','Map local properties','Map link type constraints'],finishLabel:'Implement',doc:'https://www.palantir.com/docs/foundry/interfaces/implement-interface/',
 init(arg){

 },

   fSel(P+'iface','Interface',[['','请选择'],...Object.values(W().interfaces).map(i=>[i.id,i.name+'（'+i.apiName+'）'])],d.iface,(d.from==='if'?'disabled ':'')+'data-after="implReset"')+
   fSel(P+'ot','Object type',[['','请选择'],...Object.values(W().objectTypes).map(o=>[o.id,o.name+(d.iface&&o.interfaces.some(x=>x.iface===d.iface)?'（已实现）':'')])],d.ot,(d.from==='ot'?'disabled ':'')+'data-after="implReset"')+'</div>'+
   (it?'<h4 style="margin-top:14px">接口要求的属性</h4>'+table(['属性','Base type','要求'],it.properties.map(p=>[esc(p.name)+' <code>'+esc(p.apiName)+'</code>',esc(p.baseType),p.required?badge('required','pk'):badge('optional')])):'')
  if(step===1)return '<p class="muted">把接口属性映射到 '+esc(ot.name)+' 的本地属性。<b>required</b> 属性必须映射，<b>optional</b> 可以跳过；只能选择 Base type 相同的属性。</p>'+
   table(['接口属性','Base type','要求','映射到本地属性'],it.properties.map(ip=>{const opts=ot.properties.filter(p=>p.baseType===ip.baseType);return [esc(ip.name)+' <code>'+esc(ip.apiName)+'</code>',esc(ip.baseType),ip.required?badge('required','pk'):badge('optional'),'<select data-bind="'+esc(P+'mapping.'+ip.apiName)+'" aria-label="映射 '+esc(ip.name)+'">'+options([['','未映射'],...opts.map(p=>[p.id,p.name+'（'+p.id+'）'])],d.mapping[ip.apiName]||'')+'</select>'+(opts.length?'':'<div class="small-t" style="color:var(--red-t)">'+esc(ot.name)+' 没有 '+esc(ip.baseType)+' 类型的属性</div>')]}))+
   ''
  if(step===2){
   const lcs=it.linkConstraints||[]
   if(!lcs.length)return '<p class="note">接口「'+esc(it.name)+'」没有定义 Link type constraints，这一步无需映射，直接点 Implement。</p>'
   return '<p class="muted">为每个关系约束选择 '+esc(ot.name)+' 上一条已有的 Link type（目标和 Cardinality 必须符合）。required 约束必须映射；没有合适的关系时，先去创建 Link type。</p>'+
    table(['约束','目标','Cardinality','要求','映射到 Link type'],lcs.map(lc=>{const opts=linkOptionsFor(ot,lc);return [esc(lc.apiName)+(lc.description?'<div class="muted small-t">'+esc(lc.description)+'</div>':''),esc(lc.targetKind==='interface'?'接口 · '+(W().interfaces[lc.target]?.name||lc.target):otName(lc.target)),lc.cardinality,lc.required?badge('required','pk'):badge('optional'),'<select data-bind="'+esc(P+'links.'+lc.apiName)+'" aria-label="映射 '+esc(lc.apiName)+'">'+options([['','未映射'],...opts.map(l=>[l.id,l.a.displayName+' ↔ '+l.b.displayName])],d.links[lc.apiName]||'')+'</select>'+(opts.length?'':'<div class="small-t" style="color:var(--red-t)">没有符合的 Link type</div>')]}))+
    '<p class="muted small-t">官方还有 Map action type constraints（Beta）一步，本沙盒未实现。</p>'
  }
  return ''
 },
 next(d,step){
  const it=W().interfaces[d.iface],ot=W().objectTypes[d.ot]
  if(step===0){
   if(!it||!ot)throw Error('请选择接口和对象类型。')
   if(ot.interfaces.some(x=>x.iface===it.id))throw Error(ot.name+' 已经实现了 '+it.name+'。')
  }
  if(step===1){
   const miss=it.properties.filter(p=>p.required&&!d.mapping[p.apiName])
   if(miss.length)throw Error('required 属性必须映射：'+miss.map(p=>p.name).join('、')+'。')
  }
  if(step===2){
   const miss=(it.linkConstraints||[]).filter(lc=>lc.required&&!d.links[lc.apiName])
   if(miss.length)throw Error('required 关系约束必须映射：'+miss.map(lc=>lc.apiName).join('、')+'。')
  }
 },
 finish(d){

function fnEnsureParam(at,inp,{newParam=false}={}){
 const t=fnParamType(inp.type,W());if(!t)throw Error('函数输入 '+inp.name+' 的类型不受支持。')

 let id=toParamId(inp.name);while(at.parameters.some(p=>p.id===id))id+='2'
 at.parameters.push(mkParam(id,inp.name,t.type,{objectType:t.objectType,required:!inp.optional,multiple:!!t.list}));return id
}

/* ============ 条件：提交条件与参数 Override 共用 ============ */
const MULTI_OPS=[['includes','includes'],['includesAny','includes any'],['isIncludedIn','is included in'],['eachIs','each is'],['eachIsNot','each is not']]
const LOGIC_OPS=[['all','all：全部满足'],['any','any：任一满足'],['none','none：都不满足']]
const listOf=v=>Array.isArray(v)?v.map(String).filter(x=>x!==''):splitList(v)
const isListParam=(at,path)=>{const [pid,prop]=String(path).split('.');const p=at.parameters.find(x=>x.id===pid);return !!p&&!!p.multiple&&!prop}
function condValue(at,vals,path,onto){
 const [pid,prop]=String(path).split('.'),p=at.parameters.find(x=>x.id===pid)
 if(!p)return undefined
 if(!prop)return p.multiple?listOf(vals[pid]):vals[pid]
 return paramProp(at,vals,path,onto)
}
function condCmp(a,op,b){

 const x=num?na:String(a??''),y=num?nb:String(b??'')
 if(op==='matches'){try{return new RegExp(String(b)).test(String(a??''))}catch{return false}}
 return {is:x===y,isNot:x!==y,lt:x<y,lte:x<=y,gt:x>y,gte:x>=y}[op]
}
function condLabel(at,c){
 if(c.kind==='group')return 'Group · '+c.op
 if(c.kind==='user'){
  if(c.mode==='userId')return 'Current user 是 '+(c.users||[]).map(u=>USERS[u]?.name||u).join(' / ')
  if(c.mode==='attribute')return 'Current user 的 '+c.attr+' '+(MULTI_OPS.concat(OPS).find(o=>o[0]===c.op)?.[1]||c.op)+' 「'+c.value+'」'
  return 'Current user 属于 '+(c.groups||[]).map(g=>USER_GROUPS.find(x=>x[0]===g)?.[1]||g).join(' / ')
 }
 const opl=(MULTI_OPS.concat(OPS).concat([['matches','matches']]).find(o=>o[0]===c.op)||[,c.op])[1]
 return (c.length?'length('+paramLabel(at,c.left)+')':paramLabel(at,c.left))+' '+opl+' '+(c.rightKind==='value'?'「'+c.right+'」':c.rightKind==='empty'?'（空）':paramLabel(at,c.right))
}
function evalCond(c,ctx){
 const {at,vals,onto}=ctx
 if(c.kind==='group'){const r=evalCondList(c.children||[],c.op,ctx);return {pass:r.pass,label:condLabel(at,c)}}
 if(c.kind==='user'){
  const u=USERS[S.user]
  let pass=false
  if(c.mode==='userId')pass=(c.users||[]).includes(S.user)
  else if(c.mode==='attribute'){const v=u.attributes?.[c.attr];if(v===undefined)pass=false;else pass=c.op==='isNot'?String(v)!==String(c.value):String(v)===String(c.value)}
  else pass=u.groups.some(g=>(c.groups||[]).includes(g))
  return {pass,label:condLabel(at,c)}
 }
 const leftList=isListParam(at,c.left)
 let l=condValue(at,vals,c.left,onto)
 const r=c.rightKind==='value'?c.right:c.rightKind==='empty'?'':condValue(at,vals,c.right,onto)
 let pass
 if(c.length){const n=leftList?listOf(l).length:(l===''||l==null?0:1);pass=condCmp(n,c.op,c.rightKind==='empty'?0:r)}
 else if(MULTI_OPS.some(o=>o[0]===c.op)){
  const L=leftList?listOf(l):[String(l??'')].filter(x=>x!==''),R=Array.isArray(r)?r.map(String):c.rightKind==='value'?splitList(r):[String(r??'')]
  pass={includes:L.includes(String(R[0]??'')),includesAny:L.some(x=>R.includes(x)),isIncludedIn:R.includes(String(Array.isArray(l)?l[0]:l??'')),eachIs:L.length>0&&L.every(x=>x===String(R[0]??'')),eachIsNot:L.every(x=>x!==String(R[0]??''))}[c.op]
 }else if(c.rightKind==='empty'&&leftList)pass=c.op==='is'?listOf(l).length===0:listOf(l).length>0
 else pass=condCmp(Array.isArray(l)?l.join(','):(l??''),c.op,Array.isArray(r)?r.join(','):(r??''))
 return {pass:!!pass,label:condLabel(at,c)}
}
function evalCondList(list,op,ctx){
 const results=list.map(c=>({...evalCond(c,ctx),message:c.message}))
 const n=results.filter(r=>r.pass).length
 const pass=!list.length?true:op==='any'?n>0:op==='none'?n===0:n===list.length
 return {pass,results}
}
/* 参数 Override：按顺序，第一个条件成立的 block 生效 */
function effectiveParams(at,vals,onto){
 const connectorInputs=new Set((at.effects||[]).flatMap(rule=>Object.values(rule.inputs||{}).filter(input=>input.source==='param').map(input=>input.value)))
 return at.parameters.map(p=>{
  const e={...p}
  if(p.webhookInput&&connectorInputs.has(p.id))e.required=true
  for(const blk of p.overrides||[]){
   if(!blk.conditions?.length)continue
   if(evalCondList(blk.conditions,blk.op||'all',{at,vals,onto}).pass){
    const t=blk.then||{}
    if(t.required==='required')e.required=true
    if(t.required==='optional')e.required=false
    if(t.visibility==='hidden')e.hidden=true
    if(t.visibility==='visible')e.hidden=false
    if(t.options!==undefined&&t.options!==''){e.constraint='choice';e.options=t.options}
    e.overrideDefault=t.default
    e.activeOverride=(p.overrides||[]).indexOf(blk)
    break
   }
  }
  return e
 })
}
/* 参数可选项：对象下拉过滤 / 从对象集取值 */
function filterObjects(at,vals,spec,objectType,onto){

 if(spec?.around?.fromParam&&spec.around.link){
  const src=paramObject(at,vals,spec.around.fromParam,onto),l=onto.linkTypes[spec.around.link]
  if(!src||!l)return []
  const s=sideOf(l,src.ot.id)
  const keys=new Set(linkedObjects(l,s,src.obj,onto).map(o=>String(o[ot.primaryKey])))
  objs=objs.filter(o=>keys.has(String(o[ot.primaryKey])))
 }

  if(!f.prop)continue
  const vs=f.source==='static'?splitList(f.value):f.source==='param'?listOf(vals[f.value]):[paramProp(at,vals,f.value,onto)].filter(x=>x!==undefined).map(String)
  objs=objs.filter(o=>vs.includes(String(o[f.prop])))
 }

}

function packWorkspace(state){
 const functionCode={},ids=new Map();
 const packed=JSON.parse(JSON.stringify(state,(key,value)=>{
  if(key==='js'&&typeof value==='string'){
   if(!ids.has(value)){const id='code'+ids.size;ids.set(value,id);functionCode[id]=value}
   return {$functionCodeRef:ids.get(value)}
  }
  return value
 }));
 return {state:packed,functionCode}
}
function unpackWorkspace(data){
 return JSON.parse(JSON.stringify(data.state),(key,value)=>{
  if(key==='js'&&value&&typeof value==='object'&&typeof value.$functionCodeRef==='string'){
   const source=data.functionCode?.[value.$functionCodeRef];if(typeof source!=='string')throw Error('函数运行代码快照不完整。');return source
  }
  return value
 })
}

  if(c.kind==='user')return evalCond(c,ctx).pass

}

function aipRefreshProposal(proposal,at,read){
 proposal.fields=effectiveParams(at,proposal.vals,read.onto).filter(p=>!p.hidden&&proposal.vals[p.id]!==undefined).map(p=>{
  const value=proposal.vals[p.id],ref=p.type==='Interface reference'?parseIref(value):null,ot=read.types[ref?.ot||p.objectType]
  const obj=ot&&read.objects(ot.id).find(r=>String(r[ot.primaryKey])===String(ref?.pk||value))
  return {id:p.id,name:p.name,value:obj?aipRecord(ot,obj).label+' · '+value:String(value)}
 })
 proposal.choices=aipDraftOptions(proposal,at,read)
}
function aipMakeActionProposal(action,question,read,conversation){
 const at=aipActionType(read,action?.actionType)
 if(!at)throw Error('当前用户无法办理该 Action。')
 const previous=action.mode==='revise'?conversation.pending:null
 if(action.mode==='revise'&&(!previous||previous.id!==at.id||previous.version!==at.version)){
  throw Error('找不到可继续修改的草稿，请重新描述要办理的业务。')
 }
 const vals={...previous?.vals},excluded={...previous?.excluded},warnings=[],resolution=[]
 const visible=effectiveParams(at,vals,read.onto).filter(p=>!p.hidden&&!p.multiple)
 for(const key of action.clear||[]){
  if(!visible.some(p=>p.id===key))continue
  if(key===aipAgentPolicy(at).replacementParameter&&vals[key])excluded[key]=vals[key]
  aipSetActionValue(at,vals,key,undefined)
 }
 const source=aipNormalize(question).replace(/\s+/g,'')
 for(const arg of action.parameters||[]){
  const p=visible.find(p=>p.id===arg?.name)
  const value=typeof arg?.value==='string'?arg.value.trim():''
  if(!p||!value||value.length>120)continue
  const [year,month,day]=value.split('-')
  const chineseDate=p.type==='Date'&&aipDate(value)?year+'年'+Number(month)+'月'+Number(day)+'日':''
  const mentioned=source.includes(aipNormalize(value).replace(/\s+/g,''))||(chineseDate&&source.includes(chineseDate))
  const focus=conversation.focus
  if(p.type==='Object type'){
   const target=aipInterfaceImpls(at,p.interface,read).find(t=>[t.id,t.apiName,t.name].includes(value))
   if(target&&(mentioned||source.includes(aipNormalize(target.name))))aipSetActionValue(at,vals,p.id,target.id)
   continue
  }
  if(p.type==='Interface reference'){
   const ref=parseIref(value),impls=aipInterfaceImpls(at,p.interface,read)
   const matches=impls.flatMap(t=>ref?(ref.ot===t.id?read.objects(t.id).filter(o=>String(o[t.primaryKey])===ref.pk).map(o=>({t,o})):[]):aipFindObjects(read,t,value).map(o=>({t,o})))
   const match=matches.length===1?matches[0]:null
   if(match&&(mentioned||(ref&&source.includes(aipNormalize(ref.pk)))||(focus?.type===match.t.apiName&&String(focus.id)===String(match.o[match.t.primaryKey])))){
    aipSetActionValue(at,vals,p.id,irefOf(match.t.id,match.o[match.t.primaryKey]));resolution.push({field:p.name,record:aipRecord(match.t,match.o)})
   }else warnings.push('请在表单中选择'+p.name+'。')
   continue
  }
  const refType=read.types[p.objectType]
  const focusLink=refType&&aipReadableLinks(read,refType).find(l=>l.apiName===aipAgentPolicy(at).lookup?.[p.id]?.link)
  const fromFocus=focus&&(refType?.apiName===focus.type||focusLink?.target.apiName===focus.type)&&[focus.id,focus.name].some(entry=>aipNormalize(entry)===aipNormalize(value))
  if(!mentioned&&!fromFocus)continue
  if(p.type==='Object reference'){
   const {records,via}=aipActionRef(read,at,p,value)
   if(records.length!==1){aipSetActionValue(at,vals,p.id,undefined);warnings.push('请在表单中选择'+p.name+'。');continue}
   if(excluded[p.id]===records[0].id&&mentioned)delete excluded[p.id]
   aipSetActionValue(at,vals,p.id,records[0].id)
   resolution.push({field:p.name,record:records[0],via})
  }else if(BASE_TYPES.includes(p.type)&&typeOk(p.type,value)){
   aipSetActionValue(at,vals,p.id,value)
  }
 }
 for(const p of visible){
  if(!['Object reference','Interface reference','Object type'].includes(p.type)||!vals[p.id])continue
  if(!aipActionOptions(at,p,read,vals,excluded).includes(String(vals[p.id]))){
   aipSetActionValue(at,vals,p.id,undefined)
   warnings.push(p.name+'需要重新选择。')
  }
 }
 const replace=visible.find(p=>p.id===aipAgentPolicy(at).replacementParameter&&p.type==='Object reference')
 if(replace&&vals[replace.id]&&!aipActionOptions(at,replace,read,vals,excluded).includes(String(vals[replace.id]))){
  aipSetActionValue(at,vals,replace.id,undefined)
  warnings.push('指定的'+replace.name+'不符合当前提交条件，请重新选择。')
 }
 const proposal={id:at.id,version:at.version,name:at.name,apiName:at.apiName,vals,excluded,warnings,resolution,mode:action.mode}
 aipRefreshProposal(proposal,at,read)
 return proposal
}
function retainAipDraft(modal){
 const draft=modal?.aipProposal
 if(!draft||draft.submitted||S.ui.aip?.pending!==draft||S.ui.aip.user!==S.user)return
 const read=aipReadScope(),at=aipActionType(read,draft.apiName)
 if(!at||at.id!==draft.id||at.version!==draft.version)return
 draft.vals=Object.fromEntries(effectiveParams(at,modal.vals,read.onto)
  .filter(p=>!p.hidden&&modal.vals[p.id]!==''&&modal.vals[p.id]!=null).map(p=>[p.id,modal.vals[p.id]]))
 aipRefreshProposal(draft,at,read)
}
function recordAipSubmission(modal,at){
 const aip=S.ui.aip,turn=aip?.turns[modal.aipTurn]
 if(!turn?.proposal||aip.pending!==turn.proposal)return
 turn.proposal.submitted=true
 aip.pending=null
 turn.message='已提交「'+at.name+'」。'
 const read=aipReadScope()
 const records=modal.result.edits.flatMap(edit=>{
  const ot=read.types[edit.ot]
  return ot&&edit.after?[aipRecord(ot,edit.after)]:[]
 })
 aip.lastAction={apiName:at.apiName,name:at.name,records}
 turn.receipt=modal.result.edits.flatMap(edit=>{
  if(LINK_RULES.includes(edit.type)){
   const link=read.onto.linkTypes[edit.link||edit.linkType]
   if(link)return [{object:edit.a+' ↔ '+edit.b,field:link.b.displayName,before:edit.type==='createLink'?'未关联':'已关联',after:edit.type==='createLink'?'已关联':'未关联'}]
  }
  const ot=read.types[edit.ot];if(!ot)return []
  return readableProperties(ot).filter(p=>String(edit.before?.[p.id]??'')!==String(edit.after?.[p.id]??'')).map(p=>({object:ot.name+' · '+edit.pk,field:p.name,before:String(edit.before?.[p.id]??'—'),after:String(edit.after?.[p.id]??'—')}))
 })
 turn.records=records
 turn.steps.push({title:'用户确认并提交 Action',tool:at.apiName,detail:'已提交 '+modal.result.edits.length+' 项变更。',records})
}
function aipConversation(aip){
 const draft=aip.pending
 return {focus:aip.focus||null,lastAction:aip.lastAction||null,
  draft:draft?{actionType:draft.apiName,name:draft.name,fields:draft.fields,stage:'待确认'}:null,
  recent:aip.turns.slice(-6).filter(turn=>!turn.error&&turn.message&&!turn.message.startsWith('等待')).slice(-4)
   .map(turn=>({question:turn.question,answer:turn.message.slice(0,320)}))}
}

function aipFilters(ot,filters,asOf){
 if(!Array.isArray(filters)||filters.length>8)throw Error('查询筛选条件无效。')
 const props=readableProperties(ot)
 return filters.map(filter=>{
  const p=props.find(p=>p.apiName===filter?.property)
  if(!p)throw Error('当前用户的可读范围内没有这个查询属性。')
  const op=filter.operator
  const symbols={eq:'=',ne:'≠',lt:'<',lte:'≤',gt:'>',gte:'≥',contains:'包含'}
  if(!Object.hasOwn(symbols,op)||typeof filter.value!=='string'||filter.value.length>120)throw Error('查询筛选参数无效。')
  const raw=filter.value==='$asOf'&&p.baseType==='Date'?asOf:filter.value
  if(!typeOk(p.baseType,raw)||(!raw&&['lt','lte','gt','gte'].includes(op)))throw Error('查询值与属性类型不匹配。')
  if(op==='contains'&&p.baseType!=='String')throw Error('包含筛选适用于文本属性。')
  if(['lt','lte','gt','gte'].includes(op)&&!['Date','Integer','Double'].includes(p.baseType))throw Error('大小比较适用于数字或日期。')
  const cast=value=>['Integer','Double'].includes(p.baseType)?Number(value):String(value).normalize('NFKC').trim().toLowerCase()
  const wanted=cast(raw)
  const comparisons={eq:value=>value===wanted,ne:value=>value!==wanted,lt:value=>value<wanted,
   lte:value=>value<=wanted,gt:value=>value>wanted,gte:value=>value>=wanted,contains:value=>value.includes(wanted)}
  const hasValue=value=>value!=null&&typeOk(p.baseType,value)&&(value!==''||p.baseType==='String')
  return {text:p.apiName+' '+symbols[op]+' '+raw,match:obj=>{
   const value=obj[p.id]
   return hasValue(value)&&comparisons[op](cast(value))
  },explain:obj=>{
   const value=obj[p.id]
   if(!hasValue(value))return p.name+'缺失或格式无效'
   return (filter.reason||'未通过筛选')+'（'+p.name+' '+String(value).slice(0,120)+'，需满足 '+symbols[op]+' '+raw+'）'
  }}
 })
}
function aipOntologyQuery(query,asOf,read){
 let ot=aipType(read,query?.objectType)
 if(!ot)throw Error('该 Object Type 未向助手开放。')
 if(!['count','list'].includes(query.mode))throw Error('查询模式无效。')
 const conditions=aipFilters(ot,query.filters,asOf)
 const unique=(type,rows)=>[...new Map(rows.filter(obj=>obj[type.primaryKey]!=null&&String(obj[type.primaryKey])!=='').map(obj=>[String(obj[type.primaryKey]),obj])).values()]
 let rows=unique(ot,read.objects(ot.id)).filter(obj=>conditions.every(f=>f.match(obj)))
 const steps=[{title:'定位查询起点',tool:ot.apiName,detail:(conditions.map(f=>f.text).join(' 且 ')||'已开放范围')+' · 匹配 '+rows.length+' 个',records:[]}]
 const resolve=step=>{
  const matches=aipReadableLinks(read,ot).filter(l=>l.apiName===step?.link)
  if(matches.length!==1)throw Error('Link 未开放或方向不明确。')
  return {...matches[0],filters:aipFilters(matches[0].target,step.filters,asOf)}
 }
 if(query.related!=null){
  const {target,link,from,apiName,filters}=resolve(query.related)
  rows=rows.filter(obj=>linkedObjects(link,from,obj,read.onto,read.objects).some(other=>filters.every(f=>f.match(other))))
  steps.push({title:'按关联对象筛选起点',tool:ot.apiName+'.'+apiName,detail:'关联'+target.name+'满足条件 · 保留 '+rows.length+' 个'+ot.name,records:[]})
 }
 const path=query.traverse??[]
 if(!Array.isArray(path)||path.length>3)throw Error('最多支持三跳查询。')
 for(const step of path){
  const {target,link,from,apiName,filters}=resolve(step),previous=ot
  rows=unique(target,rows.flatMap(obj=>linkedObjects(link,from,obj,read.onto,read.objects))).filter(obj=>filters.every(f=>f.match(obj)))
  ot=target
  steps.push({title:'Search Around → '+ot.name,tool:previous.apiName+'.'+apiName,
   detail:previous.name+' → '+ot.name+' · '+(filters.map(f=>f.text).join(' 且 ')||'沿已配置关系')+' · 去重后 '+rows.length+' 个',records:[]})
 }
 if(!Array.isArray(query.properties)||query.properties.length>8)throw Error('返回属性参数无效。')
 const selected=query.properties.map(name=>{const p=readableProperties(ot).find(p=>p.apiName===name);if(!p)throw Error('结果属性未向助手开放。');return p})
 const offset=query.offset??0,limit=query.limit??15
 if(!Number.isInteger(offset)||offset<0||offset>10000||!Number.isInteger(limit)||limit<1||limit>50)throw Error('分页参数无效。')
 rows.sort((a,b)=>String(a[ot.primaryKey]).localeCompare(String(b[ot.primaryKey])))
 const counted=query.mode==='count'
 const records=counted?[]:rows.slice(offset,offset+limit).map(obj=>{
  const attributes=selected.map(p=>({apiName:p.apiName,name:p.name,value:String(obj[p.id]??'').slice(0,120)}))
  return {...aipRecord(ot,obj,attributes.map(p=>p.name+' '+p.value).join(' · ')),attributes}
 })
 const basis=steps.map(s=>s.tool+'：'+s.detail).join('；')
 const aggregate={mode:query.mode,objectType:ot.apiName,label:ot.name,total:rows.length,basis,offset,limit,
  returned:records.length,nextOffset:!counted&&offset+records.length<rows.length?offset+records.length:null}
 const message='查到 '+rows.length+' 个符合条件的'+ot.name+'对象。'+(!counted?'本页返回 '+records.length+' 个。':'')
 steps.push({title:counted?'统计结果':'返回本页结果',tool:ot.apiName,detail:message,records})
 return {message,aggregate,records,steps,candidates:[],...(rows.length===1?{focus:{type:ot.apiName,id:String(rows[0][ot.primaryKey]),name:aipRecord(ot,rows[0]).label}}:{})}
}
async function aipRequest(path,data){
 if(location.protocol!=='http:'&&location.protocol!=='https:')throw Error('请从本地工作台服务打开 AIP 面板。')
 let response
 try{
  response=await fetch('/api/aip/'+path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:undefined)
 }catch{throw Error('无法连接本地 AIP 服务。')}
 if(!response.headers.get('Content-Type')?.includes('application/json'))throw Error('当前页面未连接本地 AIP 服务。')
 const result=await response.json()
 if(!response.ok)throw Error(result.error||'AIP 查询失败。')
 return result
}
async function checkAipConnection(){
 if(aipConnection!==null||!['aip','aip-agents','build'].includes(route()[0]))return
 aipConnection={checking:true}
 try{aipConnection=await aipRequest('config')}catch(error){aipConnection={error:error.message}}
