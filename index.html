<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>租约工作台 · Ontology Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f8;color:#19283b;font:15px/1.6 Inter,"Microsoft YaHei",sans-serif}header{padding:14px 24px;background:#18273b;color:white;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px}header small{color:#bdd5e5;margin-left:14px}main{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:90vh}nav{padding:20px 12px;background:#e5ecf3;border-right:1px solid #cfdce8}nav button{display:block;width:100%;text-align:left;margin-bottom:7px}nav button[aria-current]{background:#d1ece5;color:#064b41;border-color:#76baad}article{padding:24px;max-width:1350px;width:100%}h1,h2,h3,p{margin:0 0 10px}section{background:white;border:1px solid #d6e0ea;border-radius:10px;padding:17px;margin:12px 0}button,input,select{font:inherit;border:1px solid #aebfce;border-radius:6px;padding:8px;background:white;color:inherit;min-height:42px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #30887b;outline-offset:2px}.primary{background:#096b5e;color:white;border-color:#096b5e}.row{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.note{background:#e8f3f2;border-left:4px solid #388b80;padding:10px 12px;margin:10px 0}.muted{color:#4d6076}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:8px;border-bottom:1px solid #e1e8ef;white-space:nowrap}th{background:#edf3f7}label{display:grid;gap:3px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#172638;color:#d8eee8;padding:14px;border-radius:7px}#message{font-weight:bold;color:#165c51;margin-top:12px}#message.bad{color:#973326}button:disabled{opacity:.55;cursor:default}@media(max-width:730px){main,.grid{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;gap:6px}nav button{width:auto}article{padding:12px}}
</style>
<header><div><b>租约工作台</b><small>Ontology Lab · 本地沙盒</small></div><button id="reset">重置案例</button></header>
<main><nav id="nav" aria-label="工作台页面"></nav><article><div id="screen"></div><p id="message" role="status"></p></article></main>
<script>
const $=id=>document.getElementById(id)
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const schemas={Tenant:['id','name','age','gender'],House:['id','name','building_age','area','orientation'],Lease:['id','house_id','tenant_id','start','end','status']}
const seed={Tenant:[['T01','张三','30','男'],['T02','李四','29','男']],House:[['H01','海淀区学区房','12','82','南'],['H02','朝阳区公寓','8','65','东']],Lease:[]}
const ops={sign:'签订租约',transfer:'转让剩余租期',expire:'到期结清'}
const fresh=()=>({data:Object.fromEntries(Object.entries(schemas).map(([k,fields])=>[k,{fields,rows:structuredClone(seed[k])}])),objects:{},links:{},actions:{},leases:[],logs:[],nextId:1})
let state=fresh(),page=0,type='Tenant',target='Tenant',op='sign',selectedHouse=''
const tabs=['Datasets 数据集','Object Types 对象','Link Types 关系','Action Types 动作','租赁业务台','Action Log 日志']
const table=(heads,rows)=>'<div class="scroll"><table><thead><tr>'+heads.map(v=>'<th>'+esc(v)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'
const select=(id,label,options,value)=>'<label>'+label+'<select id="'+id+'">'+options.map(([v,t])=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select></label>'
const opts=a=>a.map(x=>[x,x])
const input=(id,label,value,kind='text')=>'<label>'+label+'<input id="'+id+'" type="'+kind+'" value="'+esc(value)+'" required></label>'
const btn=(id,label)=>'<button class="primary" id="'+id+'" type="button">'+label+'</button>'
const leases=()=>state.leases
function datasetPage(){
 const d=state.data[type]
 return '<h1>Datasets</h1><p>导入带表头的 CSV，再将源列映射到对象属性。也可直接使用张三、李四和海淀区学区房的样例。</p><section><div class="row">'+select('type','目标数据集',opts(Object.keys(schemas)),type)+'<label>上传 CSV<input id="csv" type="file" accept=".csv,text/csv"></label>'+btn('starter','加载整套样例配置')+'</div></section><section><h3>'+type+' · '+d.rows.length+' 行</h3>'+table(d.fields,d.rows)+'</section>'
}
function objectPage(){
 const d=state.data[type], existing=state.objects[type]
 return '<h1>Object Types</h1><p>租客与房屋各自有属性。租约使用独立主键，承载起止日期和承租人变更。</p><section><div class="row">'+select('type','对象类型与底层数据源',opts(Object.keys(schemas)),type)+'</div><h3>属性映射</h3><div class="grid">'+schemas[type].map((key,i)=>select('map'+i,key+(key==='id'?' · 唯一主键':key==='name'?' · 显示标题':''),opts(d.fields),existing?.mapping[i]??key)).join('')+'</div><p class="muted">保存时检查主键非空且唯一。租客与房屋的当前签约状态由有效租约推导。</p>'+btn('saveObject','保存对象类型')+'</section><section><h3>已定义对象</h3>'+table(['类型','主键','属性映射'],Object.entries(state.objects).map(([k,v])=>[k,'id',v.mapping.join(' / ')]))+'</section>'
}
function linkPage(){
 return '<h1>Link Types</h1><p>使用两条外键关系把租约连到房屋与租客。房屋和租客可以各自拥有多条历史租约。</p><section><div class="row">'+select('target','关系目标',opts(['Tenant','House']),target)+select('fk','Lease 外键',opts(['tenant_id','house_id']),target==='Tenant'?'tenant_id':'house_id')+'<label>目标主键<code>'+target+'.id</code></label></div><div class="note">租约 <b>N</b> → <b>1</b> '+target+'。转让时更新 Lease.tenant_id。到期解除当前占用关系，并保留已结束租约及其引用。</div>'+btn('saveLink','保存 Link Type')+'</section><section>'+table(['关系','外键','主键'],Object.entries(state.links).map(([k,v])=>['Lease → '+k,v,k+'.id']))+'</section>'
}
function actionPage(){
 const rule={sign:'Create Object · Lease',transfer:'Modify Object · Lease.tenant_id',expire:'Modify Object · Lease.status'}[op]
 const params={sign:'房屋、租客、开始日、结束日',transfer:'租约、接手租客、交接日',expire:'租约、结清日'}[op]
 return '<h1>Action Types</h1><p>选择要发布的动作，再配置参数规则与校验函数。</p><section><div class="row">'+select('op','动作规则',Object.entries(ops),op)+input('actionName','显示名称',ops[op])+select('guard','校验函数',[['standard','内置租约校验'],['custom','自定义条件表达式']],'standard')+'</div><div id="exprBox" hidden>'+input('expr','附加条件，例如 remainingDays >= 365','remainingDays >= 365')+'<p class="muted">可用变量 remainingDays、durationDays、tenantAge，支持 &gt;=、&lt;=、==、&gt;、&lt;。</p></div>'+table(['配置','值'],[['规则',rule],['参数',params],['返回','租约变更和审计记录']])+btn('saveAction','保存 Action Type')+'</section><section>'+table(['动作','名称','附加函数条件'],Object.entries(state.actions).map(([k,a])=>[ops[k],a.name,a.expr||'内置校验']))+'</section>'
}
function mappedObject(k,definition,source,row){
 const props=objectProperties(definition,k)
 const values=Object.fromEntries(props.map(prop=>[prop.name,row[source.fields.indexOf(prop.source)]]))
 return {...values,id:values[definition.primary??'id']}
}
const rowsFor=k=>{
 const definition=state.objects[k],source=state.data[k]
 return definition?source.rows.map(row=>mappedObject(k,definition,source,row)):[]
}
function rentPage(){
 const tenants=rowsFor('Tenant'),houses=rowsFor('House')
 const active=leases().filter(l=>l.status==='有效')
 const house=houses.find(item=>item.id===selectedHouse)
 const houseLeases=house?leases().filter(l=>l.house_id===house.id):[]
 const current=houseLeases.find(l=>l.status==='有效')
 const tenantName=id=>tenants.find(t=>t.id===id)?.name??id
 const houseName=id=>houses.find(h=>h.id===id)?.name??id
 const houseSelect=select('house','房屋对象',[['','请选择要办理业务的房屋'],...houses.map(h=>[h.id,h.id+' · '+h.name+' · '+(active.some(l=>l.house_id===h.id)?'已签约':'可租')])],house?.id??'')
 const tenantOptions=tenants.filter(t=>op==='sign'||t.id!==current?.tenant_id).map(t=>[t.id,t.name])
 const defaultDate=op==='sign'?'2023-01-01':op==='expire'?current?.end??'':current?.id==='L001'&&current.start==='2023-01-01'&&current.end==='2026-01-01'?'2025-01-01':current?.lastEvent??current?.start??''
 const ready=Boolean(house)&&(op==='sign'?!current:Boolean(current))&&Boolean(state.actions[op])
 const reason=!house?'请先选择房屋对象。':op==='sign'&&current?'这套房已有有效租约。请选择另一套房，或办理转租。':op!=='sign'&&!current?'所选房屋没有有效租约。请先签约，再办理转租或到期结清。':!state.actions[op]?'请先到 Action Types 保存这一动作。':''
 const leaseControl='<label>有效租约<input id="lease" value="'+esc(current?.id??'')+'" readonly placeholder="未找到有效租约"></label>'
 const actionInputs=op==='sign'
  ?select('tenant','租客',[['','请选择租客'],...tenantOptions],'')+input('date','起租日',defaultDate,'date')+input('end','到期日','2026-01-01','date')
  :leaseControl+(op==='transfer'?select('tenant','接手租客',[['','请选择接手租客'],...tenantOptions],''):'')+input('date',op==='transfer'?'交接日':'结清日',defaultDate,'date')
 const context=current?'<div class="house-context"><div><small>有效租约</small><strong>'+esc(current.id)+'</strong></div><div><small>当前承租人</small><strong>'+esc(tenantName(current.tenant_id))+'</strong></div><div><small>原租期</small><strong>'+esc(current.start)+' 至 '+esc(current.end)+'</strong></div></div>':''
 const summary='<section class="house-picker"><div class="house-picker-top"><div><h3>选择办理业务的房屋</h3><p class="muted">签约、转租和结清都以所选房屋为范围。</p></div>'+houseSelect+'</div>'+context+'</section>'
 const buttons='<div class="row"><button id="preview" type="button" '+(ready?'':'disabled')+'>试运行</button><button class="primary" id="apply" type="button" '+(ready?'':'disabled')+'>执行动作</button></div>'
 return '<h1>租赁业务台</h1>'+summary+
 '<section><h3>执行租约动作</h3><div class="row">'+select('op','动作',Object.entries(ops),op)+actionInputs+'</div><p class="muted">当前定义 '+esc(state.actions[op]?.name||'尚未配置')+'</p>'+(reason?'<p class="note">'+reason+'</p>':'')+buttons+'<div id="result"></div></section>'+
 '<section><h3>'+(house?esc(house.name)+' · 租约与关系':'租约与关系')+'</h3>'+(houseLeases.length?table(['租约','房屋','承租人','起租日','到期日','状态'],houseLeases.map(l=>[l.id,houseName(l.house_id),tenantName(l.tenant_id),l.start,l.end,l.status])):'<p class="muted">'+(house?'这套房还没有租约记录。':'选择房屋后查看该房源的租赁历史。')+'</p>')+'</section>'+
 '<div class="grid"><section><h3>房屋状态</h3>'+table(['房屋','房龄','面积','朝向','状态'],houses.map(h=>[h.name,h.building_age,h.area,h.orientation,active.some(l=>l.house_id===h.id)?'已签约':'可租']))+'</section><section><h3>租客状态</h3>'+table(['姓名','年龄','性别','状态'],tenants.map(t=>[t.name,t.age,t.gender,active.some(l=>l.tenant_id===t.id)?'签约中':'无有效租约']))+'</section></div>'
}
function render(){
 $('nav').innerHTML=tabs.map((t,i)=>'<button data-page="'+i+'" '+(i===page?'aria-current="page"':'')+'>'+t+'</button>').join('')
 $('screen').innerHTML=[datasetPage,objectPage,linkPage,actionPage,rentPage,()=>'<h1>Action Log</h1><section>'+table(['动作','租约','日期','原租客','新租客','状态'],state.logs)+'</section>'][page]()
}
function notice(message,bad=false){$('message').textContent=message;$('message').className=bad?'bad':''}
function parseCSV(text){
 const out=[];let row=[],value='',quoted=false
 text=text.replace(/^\uFEFF/,'')
 for(let i=0;i<=text.length;i++){
  const c=text[i]
  if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++}else quoted=!quoted;continue}
  if(!quoted&&(c===','||c==='\n'||c===undefined)){row.push(value.trim());value='';if(c!==','){if(row.some(Boolean))out.push(row);row=[]}continue}
  if(c!=='\r'&&c!==undefined)value+=c
 }
 if(quoted||!out.length||new Set(out[0]).size!==out[0].length||out[0].some(x=>!x)||out.slice(1).some(r=>r.length!==out[0].length))throw Error('CSV 需要唯一表头，且每行列数必须一致。')
 return {fields:out[0],rows:out.slice(1)}
}
function configure(){
 state=fresh();selectedHouse=''
 for(const [k,fields] of Object.entries(schemas))state.objects[k]={mapping:fields}
 state.links={Tenant:'tenant_id',House:'house_id'}
 for(const [k,name] of Object.entries(ops))state.actions[k]={name,expr:''}
 page=4;op='sign'
}
function checkExpression(expr,ctx){
 if(!expr)return true
 const m=expr.match(/^(remainingDays|durationDays|tenantAge)\s*(>=|<=|==|>|<)\s*(-?\d+)$/)
 if(!m)throw Error('条件格式无效。例如 remainingDays >= 365。')
 const a=ctx[m[1]],b=Number(m[3])
 return {'>=':a>=b,'<=':a<=b,'==':a===b,'>':a>b,'<':a<b}[m[2]]
}
const days=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/86400000)
function plan(kind,input){
 const action=state.actions[kind]
 if(!action||!state.links.House||!state.links.Tenant||!state.objects.Lease)throw Error('请先配置对象、两条关系以及当前动作。')
 const {date,end,house,tenant,id}=input
 const tenants=rowsFor('Tenant'),houses=rowsFor('House')
 const t=tenants.find(r=>r.id===tenant)
 if(!date||!Number.isFinite(Date.parse(date)))throw Error('请选择有效日期。')
 if(!houses.some(h=>h.id===house))throw Error('请先选择有效的房屋对象。')
 const before=leases().find(l=>l.id===id&&l.house_id===house&&l.status==='有效')
 let after
 if(kind==='sign'){
  if(!t||!houses.some(h=>h.id===house)||!(days(date,end)>0))throw Error('请选择房屋和租客，并使结束日晚于开始日。')
  if(leases().some(l=>l.house_id===house&&l.status==='有效'))throw Error('这套房已有有效租约。')
  let n=state.nextId
  while(leases().some(l=>l.id==='L'+String(n).padStart(3,'0')))n++
  after={id:'L'+String(n).padStart(3,'0'),house_id:house,tenant_id:tenant,start:date,end,status:'有效',lastEvent:date}
 }else{
  if(!before)throw Error('所选房屋不存在该有效租约。')
  if(date<(before.lastEvent||before.start))throw Error('操作日期不能早于租约的上一次变更。')
  if(kind==='transfer'){
   if(!t||tenant===before.tenant_id||date>=before.end)throw Error('请选择另一位租客，且交接日必须早于到期日。')
   after={...before,tenant_id:tenant,lastEvent:date}
  }else{
   if(date<before.end)throw Error('尚未到期，无法结清。')
   after={...before,status:'已结束',lastEvent:date}
  }
 }
 if(!checkExpression(action.expr,{remainingDays:days(date,after.end),durationDays:days(after.start,after.end),tenantAge:Number((t??tenants.find(r=>r.id===after.tenant_id))?.age)}))throw Error('自定义校验函数未通过。')
 return {before,after,action}
}
$('nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b){page=Number(b.dataset.page);notice('');render()}}
$('reset').onclick=()=>{state=fresh();selectedHouse='';page=0;type='Tenant';target='Tenant';op='sign';notice('已重置。');render()}
$('screen').onchange=async e=>{
 const id=e.target.id
 if(id==='type'||id==='target'||id==='op'){if(id==='type')type=e.target.value;if(id==='target')target=e.target.value;if(id==='op')op=e.target.value;render()}
 if(id==='guard')$('exprBox').hidden=e.target.value!=='custom'
 if(id==='csv'&&e.target.files[0])try{
  if(Object.keys(state.objects).length||leases().length)throw Error('当前模型已在使用。重置后可导入新的数据集。')
  const key=type,file=e.target.files[0]
  state.data[key]=parseCSV(await file.text());render();notice('已导入 '+file.name)
 }catch(err){notice(err.message,true)}
}
$('screen').onclick=e=>{
 const id=e.target.id
 try{
  if(id==='starter'){if(Object.keys(state.objects).length||leases().length)throw Error('当前工作区已有配置。请先重置，再加载样例。');configure();render();notice('样例配置已加载。');return}
  if(id==='saveObject'){
   if(leases().length)throw Error('已有租约时请保留现有对象映射。')
   const d=state.data[type],mapping=schemas[type].map((_,i)=>$('map'+i).value)
   const keys=d.rows.map(r=>r[d.fields.indexOf(mapping[0])])
   if(keys.some(x=>!x)||new Set(keys).size!==keys.length)throw Error('主键必须非空且唯一。')
   if(new Set(mapping).size!==mapping.length)throw Error('请为不同属性选择不同的源列。')
   if(type==='Lease'&&d.rows.length){
    const tenants=rowsFor('Tenant'),houses=rowsFor('House')
    const imported=d.rows.map(r=>Object.fromEntries(schemas.Lease.map((k,i)=>[k,r[d.fields.indexOf(mapping[i])]])))
    const occupied=new Set()
    for(const l of imported){
     if(!tenants.some(t=>t.id===l.tenant_id)||!houses.some(h=>h.id===l.house_id)||!(days(l.start,l.end)>0)||!['有效','已结束'].includes(l.status))throw Error('导入租约须引用已有租客和房屋，并包含有效日期与状态。')
     if(l.status==='有效'&&occupied.has(l.house_id))throw Error('同一房屋只能有一条有效租约。')
     if(l.status==='有效')occupied.add(l.house_id)
    }
    state.leases=imported
   }
   state.objects[type]={mapping};render();notice('已保存 '+type)
  }
  if(id==='saveLink'){
   if(!state.objects.Lease||!state.objects[target])throw Error('先保存 Lease 和目标对象类型。')
   if($('fk').value!==(target==='Tenant'?'tenant_id':'house_id'))throw Error('请用与目标对象相对应的外键。')
   state.links[target]=$('fk').value;render();notice('已保存关系。')
  }
  if(id==='saveAction'){
   const name=$('actionName').value.trim(),expr=$('guard').value==='custom'?$('expr').value.trim():''
   if(!name)throw Error('请输入动作名称。')
   if($('guard').value==='custom'&&!expr)throw Error('请输入附加条件。')
   checkExpression(expr,{})
   state.actions[op]={name,expr};render();notice('已保存 '+name)
  }
  if(id==='preview'||id==='apply'){
   const input=Object.fromEntries(['date','end','house','tenant','lease'].map(k=>[k==='lease'?'id':k,$(k)?.value]))
   const {before,after,action}=plan(op,input)
   if(id==='preview'){$('result').innerHTML='<pre>'+esc(JSON.stringify({变更前:before??null,变更后:after},null,2))+'</pre>';notice('试运行通过。');return}
   if(before)state.leases[state.leases.indexOf(before)]=after
   else {state.leases.push(after);state.nextId++}
   state.logs.unshift([action.name,after.id,input.date,before?.tenant_id??'—',after.tenant_id,after.status])
   render();notice('已执行 '+action.name+' · '+after.id)
  }
 }catch(err){notice(err.message,true)}
}
render()
</script><style>
.link-steps{display:flex;gap:8px;flex-wrap:wrap;padding:0;list-style:none}.link-steps li{padding:7px 10px;border-radius:6px;background:#e8edf3}.link-steps li[aria-current]{background:#d3ece5;color:#124d43;font-weight:700}.choice{display:flex;align-items:start;gap:10px;border:1px solid #d6e0ea;padding:10px;border-radius:7px;margin:6px 0}.choice input{min-height:auto;margin-top:5px}.choice small{display:block;color:#4d6076}.flow-controls{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
</style>
<script>
const modes={
 fk:['Object type foreign keys','用一个对象的外键匹配另一个对象的主键。','一对一 / 一对多'],
 join:['Join table dataset','由数据集中的两列主键决定哪些对象相连。','多对多'],
 back:['Backing object type','由中间对象连接两端，并提供租期等关系属性。','带属性的多对多']
}
const projects=['租赁沙盒 / Ontology','租赁运营 / 业务模型','共享模型 / 参考关系']
const newLink=()=>({
 step:0,mode:'fk',source:'Lease',end:'Tenant',field:'tenant_id',left:'Tenant',right:'House',cardinality:'many',
 forward:'承租人',reverse:'租约列表',api:'tenant',reverseApi:'leases',location:projects[0],
 join:null,lc:'',rc:'',leftEdge:'',rightEdge:'',middle:'Lease'
})
let linkDraft=newLink()
let linkOpen=false
let published=[]
let pending=null
const linkNames=['Relationship type','Link resources','Link type names','Save location']
const linkDescriptions=[
 '选择用什么数据定义对象实例之间的关系。',
 '选择两端的对象类型，再配置字段或数据源。',
 '从每一端出发分别命名。同一个 Link Type 可双向查询。',
 '选择存放关系定义的项目。提交后再保存到 Ontology。'
]
const objLabel=k=>state.objects[k]?.name||k
const keyTitle=k=>objLabel(k)+'.'+(state.objects[k]?.primary??'id')
const fkSource=d=>d.source??'Lease'
const pair=d=>d.mode==='fk'?[fkSource(d),d.end]:[d.left,d.right]
const currentTenantKey=houseId=>leases().find(lease=>lease.house_id===houseId&&lease.status==='有效')?.tenant_id??''
const fkFields={Lease:{Tenant:'tenant_id',House:'house_id'},House:{Tenant:'current_tenant_id'}}
const fkOptions=d=>Object.values(fkFields[fkSource(d)])
function edgeOptions(end){
 if(!state.links[end])return [['','尚未发布 Lease → '+end]]
 const definition=published.find(x=>x.mode==='fk'&&fkSource(x)==='Lease'&&x.end===end)
 return [[state.links[end],objLabel('Lease')+' → '+objLabel(end)+' · '+(definition?.forward??state.links[end])]]
}
function linkRows(d){
 if(d.mode==='fk'){
  const refs=rowsFor(d.end)
  const records=fkSource(d)==='House'
   ?rowsFor('House').map(h=>({...h,current_tenant_id:currentTenantKey(h.id)}))
   :leases()
  const keys=new Set(refs.map(ref=>ref.id))
  return records.map(row=>[row.id,row[d.field]||'—',!row[d.field]?'无当前关联':keys.has(row[d.field])?'已匹配':'无匹配'])
 }
 if(d.mode==='back')return leases().map(l=>[l[d.leftEdge],l[d.rightEdge],l.id,l.start,l.end,l.status])
 if(!d.join)return []
 const li=d.join.fields.indexOf(d.lc),ri=d.join.fields.indexOf(d.rc)
 const leftKeys=new Set(rowsFor(d.left).map(row=>row.id)),rightKeys=new Set(rowsFor(d.right).map(row=>row.id))
 return d.join.rows.map(r=>[r[li],r[ri],leftKeys.has(r[li])&&rightKeys.has(r[ri])?'已匹配':'无匹配'])
}
function linkPreview(d){
 const rows=linkRows(d)
 const headers=d.mode==='fk'?[keyTitle(fkSource(d)),d.field,keyTitle(d.end)+' 匹配状态']:
  d.mode==='join'?[keyTitle(d.left),keyTitle(d.right),'匹配状态']:[keyTitle(d.left),keyTitle(d.right),'Lease.id','起租','到期','状态']
 if(!rows.length)return '<p class="muted">尚无关系实例。签约或载入配对数据后，此处会显示实际匹配。</p>'
 const status=d.mode==='back'?rows.length+' 条中间对象记录':rows.filter(row=>row[2]==='已匹配').length+' / '+rows.length+' 行已匹配'
 return '<p class="match-summary">'+status+'</p>'+table(headers,rows)
}
function validateLink(d){
 if(d.mode==='fk'){
  const source=fkSource(d)
  if(!state.objects[source]||!state.objects[d.end])throw Error('请先创建 '+source+' 和 '+d.end+' 对象类型。')
  if(d.field!==fkFields[source][d.end])throw Error('请选择对应的外键。'+source+' → '+d.end+' 使用 '+fkFields[source][d.end]+'。')
  if(source==='House'&&(!state.links.House||!state.links.Tenant))throw Error('先发布 Lease → House 和 Lease → Tenant，房屋才能沿有效租约获取当前租客。')
  return
 }
 if(d.left===d.right||!state.objects[d.left]||!state.objects[d.right])throw Error('请选择两个不同且已创建的对象类型。')
 if(d.mode==='back'&&(!state.objects.Lease||!d.leftEdge||!d.rightEdge||d.leftEdge!==state.links[d.left]||d.rightEdge!==state.links[d.right]))throw Error('请选择中间对象的两条已发布关系。请先发布 Lease → Tenant 和 Lease → House。')
 if(d.mode==='join'&&(!d.join||!d.join.fields.includes(d.lc)||!d.join.fields.includes(d.rc)||d.lc===d.rc))throw Error('请选择配对表，并为两端映射不同的列。')
 if(d.mode==='join'&&linkRows(d).some(row=>row[2]!=='已匹配'))throw Error('配对表中存在无法匹配的主键。请先修正数据或字段映射。')
}
const node=(label,sub)=>'<span class="link-node"><strong>'+esc(label)+'</strong><small>'+esc(sub)+'</small></span>'
function topology(d,overview=false){
 const [left,right]=pair(d)
 const leftName=objLabel(left),rightName=objLabel(right)
 const wire='<span class="link-wire" aria-hidden="true"></span>'
 if(d.mode==='fk')return '<div class="link-topology" aria-label="外键指向主键">'+node(leftName,overview?'外键侧':d.field)+wire+node(rightName,(state.objects[right]?.primary??'id')+' · 主键')+'</div>'
 const center=d.mode==='back'?node(objLabel('Lease'),'中间对象') : node(d.join?.name||'Join table','两端主键配对')
 return '<div class="link-topology" aria-label="通过中间资源连接两端">'+node(leftName,(state.objects[left]?.primary??'id')+' · 主键')+wire+center+wire+node(rightName,(state.objects[right]?.primary??'id')+' · 主键')+'</div>'
}
function linkChoices(d){
 return '<fieldset class="link-choices"><legend class="visually-hidden">关系方式</legend>'+Object.entries(modes).map(([id,[label,desc,cardinality]])=>{
  const selected=d.mode===id
  return '<div class="relationship-option'+(selected?' selected':'')+'"><label><input type="radio" name="linkMode" value="'+id+'" '+(selected?'checked':'')+'><span><strong>'+label+'</strong><small>'+desc+'</small></span><span class="relation-badge">'+cardinality+'</span></label>'+(selected?topology(d,true):'')+'</div>'
 }).join('')+'</fieldset>'
}
const endOptions=()=>['Tenant','House'].map(k=>[k,objLabel(k)+(state.objects[k]?'':'（尚未创建）')])
const pkField=k=>'<div class="link-key"><small>自动使用对象主键</small><code>'+esc(keyTitle(k))+'</code><span class="relation-badge">PK</span></div>'
function linkResources(d){
 let controls=''
 if(d.mode==='fk'){
  const source=fkSource(d)
  const sourceOptions=['Lease','House'].map(k=>[k,objLabel(k)+(state.objects[k]?'':'（尚未创建）')])
  const targets=endOptions().filter(([key])=>Boolean(fkFields[source][key]))
  controls='<div class="grid link-endpoints"><div>'+select('linkSource','外键侧对象',sourceOptions,source)+select('field','外键属性',opts(fkOptions(d)),d.field)+'</div><div>'+select('end','主键侧对象',targets,d.end)+pkField(d.end)+'</div></div>'
  controls+=source==='House'?'<p class="note">House.current_tenant_id 从有效租约派生。转租时更新租约上的承租人，到期后这里显示无当前关联。一个租客可对应多套房屋。</p>':'<p class="muted">一份租约只引用一条相应对象。一个租客或一套房屋可以关联多份租约。</p>'
 }else{
  const backing=d.mode==='back'
  controls='<div class="grid link-endpoints'+(backing?' three':'')+'"><div>'+select('left','左侧对象',endOptions(),d.left)+(backing?'':pkField(d.left))+'</div>'+(backing?'<div>'+select('linkMiddle','中间对象',[['Lease',objLabel('Lease')]],'Lease')+'</div>':'')+'<div>'+select('right','右侧对象',endOptions(),d.right)+(backing?'':pkField(d.right))+'</div></div>'
  if(backing)controls+='<div class="grid">'+select('leftEdge','从中间对象到左侧的已发布关系',edgeOptions(d.left),d.leftEdge)+select('rightEdge','从中间对象到右侧的已发布关系',edgeOptions(d.right),d.rightEdge)+'</div>'
  else controls+='<div class="dataset-pick"><div><strong>'+esc(d.join?.name||'选择 Join table dataset')+'</strong><p class="muted">'+(d.join?d.join.rows.length+' 行 · 两列分别映射到对象主键':'可上传 CSV、载入样例或生成空配对表。')+'</p></div><label class="file-pick">'+(d.join?'替换 CSV':'选择 CSV')+'<input id="joinFile" type="file" accept=".csv,text/csv"></label><button type="button" id="joinSample">载入样例</button><button type="button" id="joinEmpty">生成空表</button></div>'+(d.join?'<div class="grid">'+select('lc','映射到 '+esc(keyTitle(d.left)),opts(d.join.fields),d.lc)+select('rc','映射到 '+esc(keyTitle(d.right)),opts(d.join.fields),d.rc)+'</div>':'')
 }
 return '<div class="link-canvas">'+topology(d)+controls+'</div><div class="match-panel"><h3>实例匹配预览</h3>'+linkPreview(d)+'</div>'
}
function cardinalities(d){
 return d.mode==='fk'?['一条',d.cardinality==='one'?'一条':'多条']:['多个','多个']
}
function linkDirection(d,reverse){
 const [left,right]=pair(d), from=reverse?right:left,to=reverse?left:right
 const apiId=reverse?'reverseApi':'api'
 const api=reverse?d.reverseApi:d.api
 const quantity=cardinalities(d)[Number(reverse)]
 const suffix=(quantity==='一条'?'.get()':'.all()')
 return '<div class="direction"><div class="direction-head"><strong>'+esc(objLabel(from))+' <span aria-hidden="true">→</span> '+esc(objLabel(to))+'</strong><span class="relation-badge" '+(reverse?'id="reverseQuantity"':'')+'>'+quantity+'</span></div>'+input(reverse?'reverse':'forward','显示名称',reverse?d.reverse:d.forward)+input(apiId,'API 名称',api)+'<code class="api-preview" id="'+apiId+'Preview">'+esc(from[0].toLowerCase()+from.slice(1)+'.'+api+suffix)+'</code></div>'
}
function linkNaming(d){
 return '<div class="direction-grid">'+linkDirection(d,false)+linkDirection(d,true)+'</div>'+(d.mode==='fk'?select('cardinality','反向基数',[['many',fkSource(d)==='House'?'一个租客可以关联多套房屋':'一个目标可以关联多份租约'],['one','一对一（声明）']],d.cardinality)+'<p class="muted">一对一声明表达业务预期。源数据的唯一性需要另外保证。</p>':'')
}
function linkLocation(d){
 return '<div class="project-pick">'+select('location','存放 Link Type 的项目',opts(projects),d.location)+'<button id="browseProjects" type="button" aria-expanded="false" aria-controls="projectList">浏览项目</button></div><div class="project-list" id="projectList" hidden>'+projects.map(p=>'<button type="button" data-project="'+esc(p)+'">'+esc(p)+'</button>').join('')+'</div><details class="link-permissions"><summary>权限说明</summary><p>项目位置用于组织关系定义。真实 Foundry 环境按项目和对象数据源配置访问权限，本地演示使用模拟权限。</p></details><div class="link-review">'+topology(d)+'<p>'+esc(d.forward)+' ↔ '+esc(d.reverse)+'</p></div>'
}
function linkCatalog(){
 const existing=Object.entries(state.links).filter(([k])=>!published.some(x=>x.mode==='fk'&&fkSource(x)==='Lease'&&x.end===k)).map(([k,field])=>['Lease → '+k,'外键',field,'租赁沙盒 / Ontology'])
 const rows=[...existing,...published.map(x=>[x.forward+' ↔ '+x.reverse,modes[x.mode][0],x.api+' / '+x.reverseApi,x.location])]
 return '<section class="link-library"><div class="library-top"><div><h1>Link Types</h1><p class="muted">定义租客、房屋与租约的关系，并查看发布后的实例。</p></div>'+btn('newLinkType',linkDraft.step?'继续配置 Link Type':'新建 Link Type')+'</div>'+(rows.length?table(['关系','方式','键 / API','项目'],rows):'<p class="empty-library">暂无已发布关系。创建两个对象类型后，可从「新建 Link Type」开始。</p>')+published.map(x=>'<details class="saved-link"><summary>'+esc(x.forward)+' ↔ '+esc(x.reverse)+' · 实例查询</summary>'+linkPreview(x)+'</details>').join('')+'</section>'
}
linkPage=function(){
 const d=linkDraft
 const stages=[linkChoices,linkResources,linkNaming,linkLocation]
 const staged=pending?'<section class="pending-link"><div><strong>待保存 '+esc(pending.forward)+'</strong><p class="muted">'+esc(pending.location)+' · '+esc(modes[pending.mode][0])+'</p></div><div class="pending-buttons"><button id="editPendingLink" type="button">继续编辑</button>'+btn('publishLink','保存到 Ontology')+'</div></section>':''
 const dialog=linkOpen?'<dialog id="linkWizard" aria-labelledby="linkWizardTitle"><div class="link-dialog-head"><h2 id="linkWizardTitle">新建 Link Type</h2><button id="closeLinkWizard" type="button" aria-label="关闭向导">×</button></div><div class="link-dialog-body"><ol class="task-steps">'+linkNames.map((name,i)=>'<li '+(d.step===i?'aria-current="step"':'')+'><span>'+(i<d.step?'✓':i+1)+'</span>'+name+'</li>').join('')+'</ol><div class="link-work-area"><div class="step-title">步骤 '+(d.step+1)+' / 4</div><h3>'+linkNames[d.step]+'</h3><p class="muted">'+linkDescriptions[d.step]+'</p>'+stages[d.step](d)+'</div></div><div class="wizard-message" id="linkMessage" role="status"></div><div class="link-dialog-foot"><a href="https://www.palantir.com/docs/foundry/object-link-types/create-link-type/" target="_blank" rel="noopener noreferrer">查看官方文档</a><div><button id="linkBack" type="button" '+(d.step===0?'disabled':'')+'>上一步</button>'+btn('linkNext',d.step===3?'提交':'下一步')+'</div></div></dialog>':''
 return (linkOpen?'<div id="linkDialogHost">'+dialog+'</div>':'')+staged+linkCatalog()
}
function saveCurrentInputs(d){
 for(const k of ['forward','reverse','api','reverseApi','location'])if($(k))d[k]=$(k).value.trim()
}
function syncEdges(d){
 d.leftEdge=state.links[d.left]??''
 d.rightEdge=state.links[d.right]??''
}
function validateNames(d){
 if(!d.forward||!d.reverse||![d.api,d.reverseApi].every(n=>/^[a-z][A-Za-z0-9]{0,99}$/.test(n)))throw Error('请填写双向名称。API 名为 1–100 个字母或数字，以小写字母开头。')
 const used=published.filter(x=>!(x.mode==='fk'&&d.mode==='fk'&&fkSource(x)===fkSource(d)&&x.end===d.end))
 const [left,right]=pair(d)
 const names=[[left,d.api],[right,d.reverseApi]]
 if(used.some(x=>pair(x).some((end,index)=>names.some(([type,name])=>type===end&&name===[x.api,x.reverseApi][index]))))throw Error('同一个对象类型下的 API 名必须唯一。')
}
function previewApi(d){
 const apiEnds=pair(d)
 for(const [i,key] of ['api','reverseApi'].entries()){
  const quantity=cardinalities(d)[i]
  const prefix=apiEnds[i][0].toLowerCase()+apiEnds[i].slice(1)
  $(key+'Preview').textContent=prefix+'.'+$(key).value+(quantity==='一条'?'.get()':'.all()')
 }
 $('reverseQuantity').textContent=cardinalities(d)[1]
}
const linkChange=$('screen').onchange,linkClick=$('screen').onclick,linkInput=$('screen').oninput
const preLinkRender=render,preLinkNotice=notice
notice=function(message,bad=false){
 preLinkNotice(message,bad)
 if($('linkMessage')){$('linkMessage').textContent=message;$('linkMessage').className=bad?'wizard-message bad':'wizard-message'}
}
function closeLink(){
 saveCurrentInputs(linkDraft)
 linkOpen=false;render();$('newLinkType')?.focus()
}
render=function(){
 const focusId=typeof document.activeElement?.id==='string'?document.activeElement.id:''
 const radio=document.activeElement?.name==='linkMode'?document.activeElement.value:''
 preLinkRender()
 const dialog=$('linkWizard')
 if(dialog){
  dialog.addEventListener('cancel',event=>{event.preventDefault();closeLink()})
  dialog.showModal()
  const focus=focusId&&dialog.querySelector('#'+CSS.escape(focusId))
  if(focus&&!focus.disabled)focus.focus()
  else if(radio)dialog.querySelector('input[value="'+radio+'"]')?.focus()
 }
}
$('screen').oninput=event=>{
 if(page===2&&linkOpen&&['api','reverseApi'].includes(event.target.id))previewApi(linkDraft)
 else linkInput?.(event)
}
$('screen').onchange=async event=>{
 const d=linkDraft,e=event.target
 if(page!==2){await linkChange(event);return}
 if(e.name==='linkMode'){
  const mode=e.value
  if(mode===d.mode)return
  Object.assign(d,newLink(),{mode})
  if(mode==='join')Object.assign(d,{forward:'配对房屋',reverse:'配对租客',api:'matchedHouses',reverseApi:'matchedTenants'})
  if(mode==='back')Object.assign(d,{forward:'历史租赁房屋',reverse:'历史承租人',api:'leasedHouses',reverseApi:'leaseTenants'})
  syncEdges(d);render();return
 }
 if(e.id==='joinFile'&&e.files[0]){
  try{
   const file=e.files[0],data=parseCSV(await file.text())
   if(d!==linkDraft||!linkOpen||d.mode!=='join')return
   d.join={...data,name:file.name};[d.lc,d.rc]=d.join.fields;render()
  }catch(err){notice(err.message,true)}
  return
 }
 if(e.id==='linkSource'){
  const source=e.value
  Object.assign(d,{source,end:'Tenant',field:fkFields[source].Tenant,forward:source==='House'?'当前租客':'承租人',reverse:source==='House'?'当前租住房屋':'租约列表',api:source==='House'?'currentTenant':'tenant',reverseApi:source==='House'?'rentedHouses':'leases'})
  render();notice('');return
 }
 if(['end','field','left','right','cardinality','lc','rc','leftEdge','rightEdge'].includes(e.id)){
  d[e.id]=e.value
  if(e.id==='end'&&fkSource(d)==='Lease')Object.assign(d,d.end==='House'?{field:'house_id',forward:'签约房屋',api:'house'}:{field:'tenant_id',forward:'承租人',api:'tenant'})
  if(['left','right'].includes(e.id)&&d.mode==='back')syncEdges(d)
  if(e.id==='cardinality'){previewApi(d);return}
  render()
 }
}
function loadJoinData(d,empty){
 const fields=['tenant_id','house_id']
 const tenants=rowsFor('Tenant').slice(0,2),houses=rowsFor('House').slice(0,2)
 const rows=empty||!tenants.length||!houses.length?[]:tenants.map(t=>[t.id,houses[0].id])
 if(rows.length&&houses.length>1)rows.push([tenants[0].id,houses[1].id])
 d.join={name:empty?'空配对表':'租客与房屋样例配对',fields,rows}
 ;[d.lc,d.rc]=d.left==='Tenant'?fields:[...fields].reverse()
}
$('screen').onclick=event=>{
 if(page!==2){linkClick(event);return}
 const d=linkDraft,id=event.target.id
 const project=event.target.dataset.project
 try{
  if(project){$('location').value=project;d.location=project;$('projectList').hidden=true;$('browseProjects').setAttribute('aria-expanded','false');$('browseProjects').focus();return}
  if(id==='newLinkType'){linkOpen=true;render();notice('');return}
  if(id==='closeLinkWizard'){closeLink();return}
  if(id==='editPendingLink'&&pending){linkDraft=pending;pending=null;linkOpen=true;render();notice('');return}
  if(id==='browseProjects'){
   const menu=$('projectList')
   menu.hidden=!menu.hidden
   $('browseProjects').setAttribute('aria-expanded',String(!menu.hidden))
   if(!menu.hidden)menu.querySelector('button').focus()
   return
  }
  if(id==='joinSample'||id==='joinEmpty'){loadJoinData(d,id==='joinEmpty');render();return}
  if(id==='linkBack'&&d.step>0){saveCurrentInputs(d);d.step--;render();notice('');return}
  if(id==='linkNext'){
   saveCurrentInputs(d)
   if(d.step===1)validateLink(d)
   if(d.step===2)validateNames(d)
   if(d.step<3){d.step++;render();notice('');return}
   if(pending)throw Error('请先保存或编辑当前待保存的关系。')
   if(!projects.includes(d.location))throw Error('请选择保存项目。')
   pending=structuredClone(d);linkDraft=newLink();linkOpen=false
   render();notice('Link Type 已提交。点击「保存到 Ontology」使其生效。');$('publishLink')?.focus()
  }
  if(id==='publishLink'&&pending){
   validateLink(pending);validateNames(pending)
   if(pending.mode==='fk'&&fkSource(pending)==='Lease')state.links[pending.end]=pending.field
   const index=published.findIndex(item=>item.mode==='fk'&&pending.mode==='fk'&&fkSource(item)===fkSource(pending)&&item.end===pending.end)
   if(index<0)published.push(pending);else published[index]=pending
   pending=null;render();notice('Link Type 已保存到 Ontology。')
  }
 }catch(err){notice(err.message,true)}
}
const resetLinks=$('reset').onclick
$('reset').onclick=()=>{linkDraft=newLink();published=[];pending=null;linkOpen=false;resetLinks()}
</script><script>
let meta={}, catalog={shared:[],value:[],interface:[],group:[]}, objectStep=0
const objectSteps=['Datasource','Metadata','Properties','Actions','Save location']
const catalogKinds={shared:'Shared Property',value:'Value Type',interface:'Interface',group:'Object Type Group'}
const propertyTypes=['String','Integer','Double','Boolean','Date']
const suggestedTypes={age:'Integer',building_age:'Integer',area:'Double',start:'Date',end:'Date'}
function defaultMeta(k){
 const saved=state.objects[k], data=state.data[k]
 const coreMapping=saved?.mapping??schemas[k].map(field=>data.fields.includes(field)?field:'')
 const extras=saved?.extras??data.fields.filter(field=>!coreMapping.includes(field)&&/^[A-Za-z][A-Za-z0-9_]*$/.test(field)&&!schemas[k].includes(field)).map(field=>({name:field,source:field,kind:'String'}))
 return {
  name:k,api:k,title:k==='Lease'?'id':'name',primary:'id',description:'',location:'租赁沙盒 / Ontology',group:'',interface:'',shared:'',value:'',actions:false,
  ...saved,mapping:[...coreMapping],types:{...saved?.types},extras:structuredClone(extras)
 }
}
function objectProperties(d,k){
 const core=schemas[k].map((name,index)=>({name,source:d.mapping[index],kind:d.types?.[name]??suggestedTypes[name]??'String',core:true}))
 return [...core,...(d.extras??[])]
}
function propertyValueMatches(kind,value){
 const v=String(value??'')
 if(!v)return true
 if(kind==='Integer')return /^-?\d+$/.test(v)&&Number.isSafeInteger(Number(v))
